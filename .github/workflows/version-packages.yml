name: Version npm packages

on:
  push:
    branches:
      - master
    paths:
      - ".changeset/**"

concurrency:
  group: npm-version-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create versioning App token
        id: version-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GIK_MAINTAINER_APP_ID }}
          private-key: ${{ secrets.GIK_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          title: "chore: version npm packages"
          commit: "chore: version npm packages"
        env:
          GITHUB_TOKEN: ${{ steps.version-token.outputs.token }}
