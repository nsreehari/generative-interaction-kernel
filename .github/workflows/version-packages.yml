name: Version npm packages

on:
  push:
    branches:
      - master

concurrency:
  group: npm-version-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create or update version pull request
        uses: changesets/action@v1
        with:
          version: npm run release:version
          title: "chore: version npm packages"
          commit: "chore: version npm packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
