name: Deploy host to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One in-flight publish at a time; let a newer run supersede an older one.
concurrency:
  group: publish-gik-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # npm install (not ci): the rolldown/vite wasm optional-binding tree resolves to
      # slightly different nested native-dep versions across platforms, which makes strict
      # `npm ci` fail on Linux against a lock generated elsewhere. install reconciles in-runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build host (samples/apps/host)
        # Build the workspace packages first so non-aliased barrels (e.g. @gik/kernel,
        # resolved via the workspace's dist/) exist before the host bundles them.
        run: npm run build:public-packages && npm run build:host
        env:
          # Serve under the project Pages path so asset URLs resolve.
          VITE_BASE: /gik/
          # Absolute base URL of the deployed foundry-agent-proxy Azure Function. Set the
          # `FOUNDRY_PROXY_BASE` repo variable (Settings > Secrets and variables > Actions > Variables)
          # e.g. https://my-foundry-proxy.azurewebsites.net. The foundry-agent sample calls it at runtime.
          VITE_FOUNDRY_PROXY_BASE: ${{ vars.FOUNDRY_PROXY_BASE }}

      - name: Checkout public Pages repository
        uses: actions/checkout@v5
        with:
          repository: nsreehari/gik
          ssh-key: ${{ secrets.GIK_DEPLOY_KEY }}
          path: _pages

      - name: Publish dist
        shell: bash
        run: |
          find _pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a samples/apps/host/dist/. _pages/
          touch _pages/.nojekyll
          cd _pages
          git add --all
          if git diff --cached --quiet; then
            echo "Published output is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
