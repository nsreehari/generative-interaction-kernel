name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspace packages
        run: npm run build:public-packages

      - name: Validate schemas
        run: npm run conformance

      - name: Typecheck
        run: npm run typecheck

      - name: Validate JSONata corpus
        run: npm run test:jsonata

      # The default branch currently has known Vitest failures. Keep the full
      # result visible without making all pull requests unmergeable.
      - name: Run Vitest baseline
        continue-on-error: true
        run: npm run test:vitest
