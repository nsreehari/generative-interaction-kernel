name: Publish to npm

on:
  release:
    types: [created]
  # Or manually trigger
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm install (not ci): the rolldown/vite wasm optional-binding tree resolves to
      # slightly different nested native-dep versions across platforms, which makes strict
      # `npm ci` fail on Linux against a lock generated elsewhere. install reconciles in-runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run release gate
        run: npm run release:gate

      - name: Publish all packages to npm
        run: npm publish --workspaces --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
