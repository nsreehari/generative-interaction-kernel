name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release
        if: github.event_name == 'release'
        id: release
        shell: bash
        env:
          IS_DRAFT: ${{ github.event.release.draft }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$IS_DRAFT" = "false"
          if [ "$IS_PRERELEASE" = "true" ]; then
            [[ "$TAG" =~ ^npm-next-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]
            echo "channel=next" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^npm-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package release policy
        run: npm run release:validate

      - name: Validate release channel
        if: github.event_name == 'release'
        run: node scripts/validate-release-channel.mjs "${{ steps.release.outputs.channel }}"

      - name: Run complete release gate
        run: npm run release:gate

      - name: Inspect package contents
        run: npm run release:inspect

  publish:
    name: Publish packages
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Publish unpublished package versions
        run: npm run release:publish -- --tag "${{ needs.validate.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: true

      - name: Record release summary
        if: always()
        env:
          RELEASE: ${{ github.event.release.html_url }}
          TAG: ${{ github.event.release.tag_name }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          {
            echo "## npm publication"
            echo
            echo "- Release: [$TAG]($RELEASE)"
            echo "- Channel: \`$CHANNEL\`"
            echo "- Policy: \`config/npm-release.json\`"
            echo "- Authentication: npm trusted publisher, with environment-scoped token fallback for initial package publication"
          } >> "$GITHUB_STEP_SUMMARY"
