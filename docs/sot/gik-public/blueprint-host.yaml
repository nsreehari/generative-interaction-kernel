schema_version: 1

package:
  name: "@gik/blueprint-host"
  version: "0.2.2"
  status: compatibility
  purpose: Re-export BlueprintHost and BlueprintHostProps from @gik/react during migration.
  public_entrypoint: packages/blueprint-host/src/index.ts

architecture:
  owns: []
  delegates_to_react:
    - Blueprint program preparation.
    - In-memory state and transition execution.
    - Rendering, composition, contexts, bridges, and file services.
  dependency_direction:
    - "@gik/blueprint-host -> @gik/react"
  removal_condition: Consumers import BlueprintHost directly from @gik/react.

public_exports:
  - BlueprintHost
  - BlueprintHostProps