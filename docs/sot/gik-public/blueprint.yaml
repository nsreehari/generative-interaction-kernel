schema_version: 1

package:
  name: "@gik/blueprint"
  version: "0.2.0"
  purpose: >-
    Define and validate Blueprint JSON, resolve its child Blueprint references, analyze its
    Cells, enforce structural-change policy, lower independent service and projection tier chains through the package-owned fixed
    meta-graph, materialize portable execution values, and run canonical state transitions.
  core_promise: >-
    An authored Blueprint remains distinct from its derived terminal Blueprint and Kernel program.
    The package deterministically materializes authored Blueprint plus immutable external context,
    and runs pure transitions from portable materialization, explicit state, and ordered events.
  public_entrypoint: packages/blueprint/src/index.ts
  worker_entrypoint: packages/blueprint/src/worker.ts
  worker_execution_factories:
    - "@gik/blueprint/worker/in-memory"
    - "@gik/blueprint/worker/indexed-db"
    - "@gik/blueprint/worker/filesystem-mcp"
    - "@gik/blueprint/worker/azure"
  implementation_entrypoint: blueprint/src/index.ts

terminology:
  blueprint: A JSON document that describes Cells, services, and how to produce a Kernel program.
  blueprint_structure_mode: Enforceable policy selecting fixed, authorized reconfiguration, or adaptive runtime change.
  agent_lifecycle_material: Authored semantic manifest material required when a Blueprint is exposed through a use, customize, or author lifecycle profile.
  cell: A named part of a Blueprint.
  tier: A named representation used while converting a Blueprint, declared per lowering axis.
  lowering_recipe: A declaration connecting one tier to another on a single lowering axis.
  service_axis: >-
    The lowering axis that selects the broader contract-compatible Cell implementation seam --
    sources, compute, behavior, and top-level service declarations -- not only transport
    declarations. Declared as serviceTiers plus serviceRecipes.
  projection_axis: >-
    The lowering axis that selects named potentialViews and the presentation skeleton. Declared as
    projectionTiers plus projectionRecipes.
  lowering_cell: A declaration for an operation that processes artifacts during conversion.
  external_context: Immutable JSON input readable by materialization and runtime expressions through externalContext.*.
  system_input: >-
    A named evaluator-owned pure projection declared by a Cell and referenced through
    systemInputs.<token>; it is not a persisted token or a public run-state path.
  cell_semantic_contract: The stable Cell identity, responsibility, input and output contracts, and logical data-flow role preserved across tiers.
  cell_implementation_program: The contract-compatible inner source, service or provider binding, computation, and execution details selected during materialization.
  materialized_blueprint: Portable derived execution value containing terminal Blueprint, immutable context, prepared vocabulary, program, and initial state.
  relationship: A typed connection among Cells. Blueprint validates participants but not kind-specific behavior.
  cell_impact: Static downstream analysis over one compiled Cell topology snapshot.
  exploration: A validated possibility-space snapshot with gated choices and option-driven unlocks.
  presentation: >-
    A closed, flat set of named slots plus a root describing how Cells are placed for rendering.
    A Blueprint carries at most one `presentation`; it has no knowledge of which Cells exist and no
    tree of containment — every attachment (a slot into its parent slot, a Cell into a slot) is
    self-declared by the thing attaching.
  rules:
    - Public Blueprint contracts use two independent lowering axes: serviceTiers/serviceRecipes and projectionTiers/projectionRecipes.
    - The pre-split combined tiers and recipes fields are removed; a Blueprint declaring either is rejected.
    - Lowering Cells use fromTier and toTier.
    - Cells are declared directly in a Blueprint; there is no separate Organism document.
    - Service and projection tiers and recipes are static authored materialization data.
    - Each axis resolves its own chain independently under identical chain invariants; a recipe-free axis requires exactly one terminal tier.
    - Materialization applies the complete service chain first and then the complete projection chain, so projection observes the selected terminal implementation and service selection never observes projected presentation.
    - Immutable external context may select a Cell implementation program but never changes its semantic contract.
    - Changing a context-selected implementation program requires a new materialization, not a runtime state write.

architecture:
  owns:
    - Blueprint artifact and entity contracts.
    - Cell declarations, generic token-topology analysis, and static Cell impact analysis.
    - Stateless exploration definition, inspection, and frontier analysis.
    - Tier and lowering-recipe declarations for the independent service and projection axes.
    - Lowering Cell declarations and validation.
    - Blueprint structural and semantic validation.
    - Schema validation of declared use, customize, and author lifecycle profile material.
    - Semantic Blueprint patch application and structure-mode admission.
    - Adaptive admission policy for runtime-originated Kernel ProgramPatch operations.
    - Recursive child Blueprint assembly.
    - Calling a supplied lowering function and validating its resulting Kernel program.
    - Preparing the executable vocabulary, program, and initial state for a declarative Blueprint.
    - Deterministically materializing authored Blueprint service and projection tier chains and immutable external context into a portable execution value.
    - Selecting contract-compatible Cell implementation programs through static recipe vocabulary and immutable external context.
    - Running deterministic Blueprint transitions from explicit state and ordered events.
    - Providing a Blueprint-owned adapter compatible with provider-neutral durable transition hosts.
    - Coordinating engine wakes and effect queue work through the placement-neutral @gik/blueprint/worker subpath.
  delegates_to_kernel:
    - Executable vocabulary and program contracts.
    - Program validation after lowering.
    - Runtime state and revisions.
    - Event reduction and continuous graph settlement.
    - Patches, effects, invocations, checkpoints, and execution inspection.
  does_not_own:
    - Persisting runtime state, effects, cursors, or revisions.
    - Executing host effects returned by a transition when no host orchestrator is supplied.
    - Selecting worker placement, notification transport, credentials, or trusted effect implementations.
    - Rendering, transports, Faces, or host service bindings.
    - Asynchronous, agent-driven, human-gated, or reconfigurable Lowering Cell scheduling.
    - Runtime application of executable ProgramPatch operations.
    - Host identity, credentials, or authorization mechanisms.
    - Nested child Blueprint mutation routing.
    - Treating worker startup or controller settlement as a synchronous queue-completion barrier.
  dependency_direction:
    - "@gik/blueprint -> @gik/kernel"
    - "@gik/blueprint -> @gik/evaluators for declarative schema validation"
    - "@gik/blueprint/worker -> @gik/durable-runtime and its connector subpaths"
    - "@gik/kernel must not depend on @gik/blueprint"

artifact_contracts:
  - name: BlueprintArtifact
    signature: >-
      interface BlueprintArtifact { gik: "0.1"; type: "blueprint";
      payload: BlueprintDefinition }
    guarantees:
      - Portable JSON envelope.
      - Can be lowered to a Kernel program with or without a presentation projection.
      - Supports inline or referenced child Blueprints through Cells.
  - name: MaterializedBlueprint
    signature: >-
      interface MaterializedBlueprint { gik: "0.1"; type: "materialized-blueprint";
      payload: { terminalBlueprint: BlueprintArtifact;
      externalContext: Record<string, Json>;
      vocabulary: Enveloped<ProjectedVocabularyManifest>;
      program: Enveloped<ExecutableProgramDefinition>;
      initialState: Record<string, Json> } }
    guarantees:
      - Portable JSON derived deterministically from authored Blueprint and external context.
      - Trusted by runMaterializedTransition without source hashing, assembly, or recompilation.
      - Is not an authored authority and receives no semantic Blueprint patches.
      - May be retained in memory or persisted opaquely by a stateless host.
  - name: BlueprintDefinition
    signature: >-
      interface BlueprintDefinition { id: string; kind: string; version: string;
      structureMode?: BlueprintStructureMode;
      structurePolicy?: BlueprintStructurePolicy;
      serviceTiers: TierDefinition[]; serviceRecipes: ServiceLoweringRecipeDefinition[];
      projectionTiers: TierDefinition[]; projectionRecipes: ProjectionLoweringRecipeDefinition[];
      cells?: Record<string, CellDefinition>;
      presentation?: PresentationDefinition;
      services?: Record<string, ServiceDeclaration>;
      runtime: BlueprintRuntimeDefinition; metadata?: Record<string, Json> }
    guarantees:
      - runtime carries the initial state and host dependencies used to open the Blueprint.
      - runtime is not itself an ExecutableVocabularyManifest; the host derives namespaces/actions/capabilities and supplies the executable vocabulary version, combining declared services with externals.
      - Backend and worker Blueprints do not require a presentation.
      - A service Blueprint uses the same blueprint:<id>@<version> reference grammar and host registry as a nested Cell Blueprint.
      - Interface output ports may declare from to project one runtime state path as a non-rendered result.
      - The serialized lowering-recipe collections are serviceRecipes and projectionRecipes in version 0.1; the pre-split recipes field is rejected.
      - structureMode is fixed, reconfigurable, or adaptive; the schema default and host interpretation treat omission as fixed.
      - structurePolicy allowlists semantic Blueprint operations and executable program operations for adaptive mode.
      - services carry Blueprint-owned logical configuration and operation contracts, never literal credentials or host execution policy.
      - Service declarations are preserved into the opened runtime; an outer host owns ServiceHost construction and trusted kind admission.
  - name: BlueprintRuntimeDefinition
    signature: >-
      interface BlueprintRuntimeDefinition { externals?: Omit<ExternalsSpec, "services">;
      state?: Record<string, Json> }
    purpose: Supply declarative initial state and host dependencies from which a host constructs executable vocabulary.
    guarantees:
      - namespaces and actions are never authored here -- a host derives them (namespaces from this record's own state keys, actions by scanning authored Cell behavior) when constructing the executable vocabulary manifest.
      - Manifest capabilities are populated from the capability names actually referenced by materialized Cell views and decorations, not authored on this record.
  - name: TierDefinition
    signature: >-
      interface TierDefinition { id: string; kind: string; schema?: string;
      description?: string; input?: Record<string, Json> }
  - name: LoweringRecipeDefinition
    signature: >-
      interface LoweringRecipeDefinition { id: string; from: string; to: string }
    schema_requirement: >-
      The shared identity of a tier transition. It is never authored on its own: a Blueprint declares
      only the two concrete axis dialects below.
  - name: ServiceLoweringRecipeDefinition
    signature: >-
      interface ServiceLoweringRecipeDefinition extends LoweringRecipeDefinition {
      implementationPrograms: BlueprintImplementationProgram[];
      implementationFallback: string }
    purpose: >-
      Select the contract-compatible Cell implementation seam -- sources, compute, behavior, and
      top-level service declarations -- for one service-axis tier transition. The axis is named
      service because it chooses which concrete backing service implementation answers already
      authored contracts, but the selected implementation program carries the whole
      contract-compatible implementation of that choice, not only transport declarations.
    guarantees:
      - A service recipe never reads or writes potentialViews or presentation.
      - Implementation selection must preserve authored source ids, resolved operation contracts, and declared event handlers.
      - The service chain is applied in full before any projection recipe, so service selection can never depend on projected presentation.
  - name: ProjectionLoweringRecipeDefinition
    signature: >-
      interface ProjectionLoweringRecipeDefinition extends LoweringRecipeDefinition {
      representations: BlueprintRepresentation[]; fallback: string }
    purpose: >-
      Select named potentialViews and the presentation skeleton for one projection-axis tier
      transition.
    guarantees:
      - Every projection recipe produces an authored presentation projection.
      - A representation may declare decorators whose JSONata select expression returns one Cell id or an array of Cell ids.
      - Decorator select evaluates during lowering against blueprint, payload, cells, and immutable externalContext.
      - A decorator may add one before and/or after CellViewDecoration to every selected presented Cell.
      - Decorators are applied after inherited view overrides and before terminal Blueprint validation.
      - The projection chain is applied after the complete service chain, so a representation observes the selected terminal implementation.
      - Representation selection resolves independently from contract-compatible Cell and service implementation selection.
  - name: BlueprintRepresentationDecorator
    signature: >-
      interface BlueprintRepresentationDecorator { select: string;
      before?: CellViewDecoration; after?: CellViewDecoration }
    guarantees:
      - Selection is deterministic lowering-time JSONata over the current Blueprint artifact.
      - Selection must return only known Cell ids whose terminal Cells have view capabilities.
      - Generated decorations are retained as ordinary static terminal Blueprint data.
      - Nested before or after decorations are rejected.
  - name: CellViewDecoration
    signature: >-
      interface CellViewDecoration { capability: string; props?: Record<string, Json>;
      bindings?: Record<string, CellViewBinding>; visibility?: string }
    guarantees:
      - Executable preparation emits decorations and the original Cell inside a presentation fragment.
      - Generated node ids are stable and derived from the original Cell id, position, and order.
      - Runtime bindings and visibility are scoped to the original matched Cell's cellRunState.
      - The identical shape is reused for a CellPotentialView's optional `wrap` array (outermost
        first): each layer nests the next as its own `edges.children` rather than sitting beside it
        as `before`/`after` do, so it renders as a genuine child in that layer's own component tree.
        A wrap layer stays exactly as inert as `before`/`after` (no event, no derivation of its own);
        the one real difference is that its own `visibility` gates its whole subtree, including the
        wrapped primary, unlike `before`/`after`'s independent, sibling-scoped visibility.
  - name: BlueprintImplementationProgram
    signature: >-
      interface BlueprintImplementationProgram { id: string; when?: string;
      cells?: Record<string, { sources?; compute?; behavior? }>;
      services?: Record<string, ServiceDeclaration> }
    guarantees:
      - Cell overrides are limited to inner-program facets.
      - A source's contract is never authored -- it is always resolved from the service operation it names, so source ids and their resolved contracts remain identical to the authored Cell.
      - Every source's service and operation must resolve to a declared entry in services; unresolvable references are rejected at validation time.
      - Replacement service declarations preserve the authored logical operation names and contracts.
      - A source's optional acceptanceCriteria (the same GuardrailRule[] vocabulary as an operation's response.validators, plus blueprint-capability-acceptance) is additive to that operation's response.validators and gated by its one onViolation -- never a second policy authority. Enforcement is host-level, right after response.transform and before settlement.transform; materialization and runTransition never read or evaluate it.
  - name: CellDefinition
    purpose: Describe one cohesive participant without making it intrinsically a graph node, workflow step, or visual component.
    facets:
      - inputs
      - systemInputs
      - sources
      - compute
      - outputs
      - events
      - behavior
      - potentialViews
      - child Blueprint
    guarantees:
      - A Cell may be viewless, state-free, service-only, computational, or recursively composed.
      - Cell map keys equal Cell ids.
      - A Cell's semantic contract is stable across tiers even when lowering selects a different contract-compatible implementation program.
      - compute.assign paths become explicit Kernel graph operations; Cell computation is not duplicated as program.derivations.
      - outputs.from identifies the value to publish, and outputs.when withholds publication when its safe predicate is false.
      - An output produced during the same Cell evaluation references computed.<assign-path>; bare assignment paths are not evaluator roots.
      - A pure Cell may forward a declared inputs.<alias> path without a synthetic compute assignment.
      - systemInputs declares evaluator-owned named projections available as systemInputs.<token>.
      - Cell evaluator expressions use explicit inputs, sources, systemInputs, and computed namespaces.
      - blueprintRunState and cellRunState are internal implementation namespaces unavailable to Cell authors.
      - Source effects settle into blueprintRunState.cells.<id>.sourceValues before the Cell is reactivated.
      - blueprintRunState persists raw source request/completion tokens; derived system-input values are not persisted.
  - name: CellBlueprint
    signature: >-
      type CellBlueprint = { $ref: string | CellViewBinding; inline?: never }
      | { inline: BlueprintArtifact; $ref?: never }
    guarantees:
      - A literal $ref is recursively assembled; its required child inputs are validated by
        validateBlueprintArtifact against the hosting Cell's own declared inputs ports, unconditionally
        (never gated on lowering stage, since ports never change across lowering) and never dependent
        on potentialViews/region/presentation, since hosting is a data-flow property exactly like
        sources or compute.
      - A bound $ref uses the same from-or-expression grammar as Cell view bindings.
      - Lowering shapes a bound reference into the reserved hostedBlueprint declaration consumed by the runtime host.
      - Runtime mounting fails closed if a binding reaches the host without resolving to a string reference.
  - name: PresentationDefinition
    signature: >-
      interface PresentationDefinition { slots: readonly PresentationSlot[]; root: string;
      allowedCapabilities?: readonly string[] }
      type PresentationSlot = string | { id: string; region?: string }
    purpose: >-
      A closed, flat set of named slots plus a root. Presentation has no knowledge of Cells and no
      tree of who contains whom — a slot self-declares its own parent slot via `region`, the same
      mechanism a Cell's own `view.region` uses to attach into a slot.
    guarantees:
      - Every slot id is unique; root and every declared `region` reference a slot id in the same slots array.
      - Slot nesting must not cycle.
      - A Cell attaches to a slot on its own view (`CellView.region`), never inside the presentation structure.
      - A Cell's `region` may be an array, rendering one independent instance per named slot, all reading and
        writing through that one Cell — a Cell is no longer restricted to appearing at most once.
      - Slot declaration order, then Cell declaration order, deterministically defines the projected child
        order within a slot: nested slot-children always render ahead of any Cell attached directly to that
        same slot.
      - Slot names express caller-authored semantic placement intent and are not component capability
        insertion points; a slot itself carries no capability or props — visual styling for a region is
        always a rendering host/theme concern, never Blueprint-authored data.
      - allowedCapabilities is optional; when absent, any capability name is legal. When present, it is a
        real, validated closed set -- every capability referenced by this Blueprint's Cell views and view
        decorations must appear in it, or Blueprint validation fails.
    consumed_by:
      - When present, the reserved top-level `presentation` entry is the layout the current compiler projects.
      - composeCellProgram requires a valid root and walks the slot/Cell attachment graph into the Kernel
        projection tree, emitting one DocNode per (slot, Cell) attachment.
      - Representation lowering may replace a presentation (`presentation`) or append additional slot entries
        (`presentationAppend`, a flat array concat — slots are a list, not a nested tree to merge).
      - Without `presentation`, composeCellProgram emits a non-projected Kernel program from Cell event
        handlers, computations, and source refresh behavior -- except that any Cell hosting another
        Blueprint (`blueprint`) still gets a minimal, discoverable root built from that Cell's own
        `inputs` ports, since hosting is a data-flow property and must never depend on presentation.

artifact_api:
  - name: createBlueprint
    signature: "createBlueprint(definition: BlueprintDefinition): BlueprintArtifact"
    behavior:
      - Clones the definition.
      - Validates the resulting artifact.
  - name: validateBlueprintArtifact
    signature: "validateBlueprintArtifact(value: unknown): asserts value is BlueprintArtifact"
    throws: BlueprintValidationError
    guarantees:
      - For every Cell whose `blueprint` is an inline hosted child, checks that Cell's own declared
        `inputs` ports satisfy every required entry of the child's own `interface.inputs` --
        unconditionally, since a Cell's ports never change across lowering. Never depends on
        potentialViews/bindings/region/presentation, which are an entirely separate, optional concern
        from data flow; hosting works exactly like sources or compute.
  - name: parseBlueprintJson
    signature: "parseBlueprintJson(text: string): BlueprintArtifact"
    behavior: Parses JSON and validates the artifact.
  - name: stringifyBlueprint
    signature: "stringifyBlueprint(blueprint: BlueprintArtifact): string"
    behavior: Validates and pretty-prints the artifact.
  - name: assembleBlueprint
    signature: >-
      assembleBlueprint(source: BlueprintArtifact,
      resolveReference?: BlueprintReferenceResolver): BlueprintArtifact
    behavior:
      - Recursively replaces child Blueprint references with inline artifacts.
      - Rejects unresolved literal references.
      - Preserves bound references for runtime lowering and host resolution.
      - Rejects recursive Blueprint identity cycles.
      - Does not mutate source artifacts.
      - Returns a validated self-contained artifact.

structure_patch_api:
  contracts:
    - BlueprintStructureOperation
    - BlueprintStructurePolicy
    - BlueprintPatchOperation
    - BlueprintPatch
    - BlueprintPatchOrigin
    - BlueprintPatchRequest
    - BlueprintPatchDecision
    - BlueprintStructureError
  functions:
    - name: admitBlueprintPatch
      signature: >-
        admitBlueprintPatch(blueprint: BlueprintArtifact,
        request: BlueprintPatchRequest): BlueprintPatchDecision
      behavior:
        - fixed rejects every semantic structure patch.
        - reconfigurable accepts only origin authorized and rejects runtime origin.
        - adaptive accepts only operations listed by structurePolicy.allowedBlueprintOperations.
    - name: admitAdaptiveProgramPatch
      signature: >-
        admitAdaptiveProgramPatch(blueprint: BlueprintArtifact,
        patch: ProgramPatch): ProgramPatch | false
      behavior:
        - fixed and reconfigurable always reject runtime-originated program patches.
        - adaptive admits only operations listed by structurePolicy.allowedProgramOperations.
    - name: applyBlueprintPatch
      signature: >-
        applyBlueprintPatch(blueprint: BlueprintArtifact,
        patch: BlueprintPatch): BlueprintArtifact
      behavior:
        - Applies Cell, relationship, and projection operations to a clone.
        - Validates the complete candidate Blueprint before returning it.
        - Rejects addCell or replaceCell operations containing child Blueprints in this phase.

cell_api:
  - name: defineCell
    signature: "defineCell(definition: CellDefinition): CellDefinition"
    behavior: Validates required identity and returns a clone.
  - name: tokenPattern
    signature: "tokenPattern(source: string): TokenPattern"
    behavior: Compiles literal and parameterized token patterns.
  - name: analyzeCellComposition
    signature: "analyzeCellComposition(cells: readonly CellDefinition[]): CellComposition"
    reports:
      - duplicate Cell ids
      - invalid token patterns
      - ambiguous providers
      - invalid output bindings
      - external input tokens
  - name: compileCellTopology
    signature: >-
      compileCellTopology(id: string,
      cellsById: Readonly<Record<string, CellDefinition>>): ExecutableCellTopology
    behavior: Derives deterministic provider-consumer edges without creating a Kernel program.
  - name: analyzeCellImpact
    signature: >-
      analyzeCellImpact(topology: ExecutableCellTopology,
      request: CellImpactRequest): CellImpactAnalysis
    behavior:
      - Reports changed Cells, transitively affected Cells, dependency-ready stages, and blockers.
      - Rejects changed or completed Cell ids absent from the supplied topology snapshot.
      - Does not execute Cells, predict execution outcomes, or mutate the topology or Blueprint.
      - Can be rerun against each accepted fixed, reconfigurable, or adaptive Blueprint snapshot.
  - name: composeCellProgram
    signature: >-
      composeCellProgram(definition: CellProjectionDefinition,
      topology: ExecutableCellTopology): ExecutableProgramDefinition
    behavior: >-
      Compiles one validated Cell topology into a Kernel executable program. A presentation
      produces a projected program; its absence produces a non-projected program.
      Compute and source Cells become evaluate-cell extension nodes. Hosted Blueprint outputs
      re-enter through event-triggered graph nodes and use transient signal ports.
      Hosting another Blueprint (`blueprint`) is an ordinary data-flow-owning Cell property, never
      dependent on presentation: every hosting Cell always gets a discoverable node -- built from
      that Cell's own `inputs` ports -- whether or not this Blueprint has any presentation at all,
      or whether that one Cell has a reachable view of its own. A view's `wrap` layers (outermost
      first) nest its primary capability's node as a genuine child inside each successive layer's own
      `edges.children`, unlike `before`/`after`, which stay flat siblings; `before`/`after` then flank
      the fully wrapped result exactly as they would the bare primary. CellProjectionDefinition is
      structural input to this function and is not separately exported from the package entrypoint.
  - name: composeCellDocument
    status: deprecated alias of composeCellProgram

transition_api:
  - name: materializeBlueprint
    signature: >-
      materializeBlueprint({ blueprint, externalContext?, resolveBlueprint?,
      capabilityCatalog? }): MaterializedBlueprint
    behavior:
      - Clones the immutable external context snapshot.
      - Assembles the authored Blueprint.
      - Compiles the package-owned fixed lowering meta-graph to a Kernel Program and executes it on a separate compiler Kernel.
      - Publishes authored Blueprint plus immutable context at lowering:source and accepts terminal output only from compiled:artifact.
      - Applies the complete service chain before the complete projection chain, so projection observes the selected terminal implementation and service selection never observes projected presentation.
      - Emits a terminal Blueprint carrying exactly one terminal tier per axis and empty serviceRecipes and projectionRecipes arrays.
      - Drives the Kernel's shared graph traversal synchronously for both deterministic recipe chains.
      - Resolves context-selected Cell implementation programs while preserving Cell semantic and data-flow contracts.
      - Prepares terminal vocabulary, executable program, and initial state from the emitted Blueprint whose two recipe arrays are empty.
      - Emits a non-projected program when the terminal Blueprint has Cells but no presentation projection.
      - Reserves externalContext as a read-only runtime namespace.
      - >-
        capabilityCatalog is an optional, host-supplied Record<capability, CapabilityDescriptor> used
        to populate the vocabulary manifest's capabilities entries; when a referenced capability is
        absent from it (including when the whole option is omitted), that capability gets a
        permissive placeholder descriptor instead ({propsSchema:{type:object,additionalProperties:true}}),
        which the Kernel's own prop-shape validation (validateProgramDefinition) then trivially
        satisfies for every prop. @gik/blueprint deliberately declares no component catalog of its
        own and does not depend on @gik/components -- supplying a real one (e.g. @gik/components'
        own generated componentCapabilities) is a host's deliberate choice to opt into stronger
        Kernel-level prop/emit-shape enforcement, exactly like a host's other admitted-capability
        decisions (credentials, providers, endpoints); it is not required for a Blueprint to author
        or execute correctly. The Blueprint-facing closed-world capability *name* contract, if a
        Blueprint wants one, remains presentation.allowedCapabilities, independent of this option.
  - name: runMaterializedTransition
    signature: >-
      runMaterializedTransition({ state, materializedBlueprint, events,
      contexts?, createOrchestrator?, sourceSettlements?, requestSettlements? }): Promise<BlueprintTransitionResult>
    behavior:
      - Trusts the portable materialization and performs no authored-source hash check.
      - Makes externalContext.* readable while rejecting writes to it.
      - Applies admitted source values before source completion and graph reactivation.
      - Delegates request receipt admission to Kernel settlement, including effect correlation and response-schema validation.
      - Returns only mutable local state; immutable external context is not copied into state.
  - name: prepareBlueprintProgram
    purpose: Prepare one assembled declarative Blueprint as vocabulary, program, and initial state.
    status: Compatibility preparation primitive; new hosts should materialize explicitly when reuse matters.
  - name: runTransition
    signature: >-
      runTransition({ state, blueprint, externalContext?, events, contexts?, createOrchestrator? }):
      Promise<{ state; effects?; blueprintPatchProposals? }>
    behavior:
      - Materializes the authored Blueprint internally and delegates to runMaterializedTransition.
      - Treats supplied state as authoritative.
      - Dispatches ordered events through the Kernel program prepared from the Blueprint.
      - Returns resulting local state and journaled effects.
      - Executes no host effects unless the caller explicitly supplies createOrchestrator.
      - Semantic Blueprint patch proposals, when present, target the authored Blueprint.
  - name: evaluateBlueprintCell
    signature: >-
      evaluateBlueprintCell({ blueprint, state, cell, externalContext?, resolveBlueprint? }):
      EvaluateBlueprintCellResult
    behavior:
      - Replaces the matching authored Cell with the supplied candidate Cell JSON in a cloned Blueprint.
      - Materializes the candidate Blueprint and evaluates the resulting terminal program Cell.
      - Resolves Cell inputs and settled source values from the supplied state.
      - Supplies raw Blueprint run state to the evaluator as internal context for declared system-input projection.
      - Returns computed values, explicit compute operations, outputs, and admitted source effects without executing effects, mutating state, or propagating downstream consequences.
      - Does not expose internal Blueprint or Cell run-state namespaces to authored Cell expressions.
      - Returns blocked status and missing required input tokens when the Cell cannot activate.
    purpose: Pure inspection, simulation, and preflight; runTransition remains the authoritative execution API.
  - name: evaluateBlueprintCellId
    signature: >-
      evaluateBlueprintCellId({ blueprint, state, cellId, externalContext? }):
      EvaluateBlueprintCellResult
    behavior:
      - Resolves the authored Cell by id and delegates to evaluateBlueprintCell.
      - Returns the same materialized preflight result without mutation, effect execution, or consequence propagation.
      - Rejects an id that is not present in the authored Blueprint.
  - name: applyBlueprintPatches
    signature: >-
      applyBlueprintPatches({ blueprint, externalContext?, state, patch, origin,
      resolveBlueprint? }): { blueprint; materializedBlueprint; state }
    behavior:
      - Admits and applies semantic operations against the authored Blueprint.
      - Rematerializes the accepted authored candidate with the same immutable external context.
      - Preserves mutable state as an independent cloned value.
      - Rejects patches according to fixed, reconfigurable, or adaptive structure policy.
  - name: createBlueprintDurableTransitionAdapter
    purpose: >-
      Return a structurally compatible DurableTransitionAdapter whose portable opaque spec carries
      authored Blueprint, external context, and MaterializedBlueprint without adding a dependency
      from @gik/blueprint to @gik/durable-runtime.

exploration_api:
  contracts:
    - ExplorationDefinition
    - ExplorationNode
    - ExplorationChoice
    - ExplorationOption
    - ExplorationState
    - ExplorationFrontier
    - ExplorationInspection
    - ExplorationEdge
  functions:
    - name: defineExploration
      signature: "defineExploration(definition: ExplorationDefinition): ExplorationDefinition"
      behavior:
        - Validates participant references, map-key identity, and option identity.
        - Returns a clone of the supplied definition snapshot.
    - name: inspectExploration
      signature: "inspectExploration(definition: ExplorationDefinition): ExplorationInspection"
      behavior: Returns deterministic participants and unlock or option edges for inspection.
    - name: analyzeExploration
      signature: >-
        analyzeExploration(definition: ExplorationDefinition,
        state: ExplorationState): ExplorationFrontier
      behavior:
        - Computes transitive unlocks and currently available choices from one definition and state snapshot.
        - Rejects unknown completed participants, choices, options, and unavailable selections.
        - Does not select options, mutate a Blueprint, or retain analysis state between calls.
  boundary: >-
    ExplorationDefinition is supplied directly by the caller; Blueprint core does not carry it as a
    field on any Blueprint document or automatically interpret arbitrary Blueprint data as exploration.
  mutation_boundary: >-
    Exploration results may inform a host or future Blueprint mutation authority. They never
    authorize, apply, lower, or schedule structural mutations themselves.

resolution_api:
  types:
    - ResolvedBlueprint
    - ResolvedBlueprintAxis
    - ResolvedBlueprintStage
  functions:
    - name: loadBlueprint
      signature: >-
        loadBlueprint(value: unknown): ResolvedBlueprint
      behavior:
        - Validates the artifact.
        - Resolves both axes' ordered recipe stages and services.
    - name: resolveBlueprintExecution
      signature: >-
        resolveBlueprintExecution(artifact: BlueprintArtifact): ResolvedBlueprint
      behavior:
        - Resolves the service and projection axes independently through one shared resolver, so both are held to identical chain invariants.
        - Builds per-axis tier and recipe lookup maps plus that axis' source and terminal tier.
        - Requires exactly one terminal tier on an axis whose recipe array is empty.
        - Requires an axis' recipes to form one connected, non-branching chain when that axis declares recipes.
        - Clones service declarations.
    - name: resolveLoweringAxis
      signature: >-
        resolveLoweringAxis<TRecipe extends LoweringRecipeDefinition>(blueprintId: string,
        axis: "service" | "projection", tiers: readonly TierDefinition[],
        recipes: readonly TRecipe[]): ResolvedBlueprintAxis<TRecipe>
      behavior:
        - The single shared implementation both axes resolve through; diagnostics name the axis.

lowering_cell_api:
  types:
    - ArtifactPort
    - LoweringCellKind
    - LoweringCellDefinition
  kinds:
    - transform
    - select-strategy
    - synthesize-strategy
    - validate
    - approve
    - emit-blueprint
  function:
    name: defineLoweringCell
    signature: "defineLoweringCell(definition: LoweringCellDefinition): LoweringCellDefinition"
    guarantees:
      - Requires a non-empty id.
      - Requires unique valid input and output ports.
      - Requires validation policy for emit-blueprint Cells.
      - Uses fromTier and toTier for tier boundaries.
  fixed_meta_graph:
    functions:
      - fixedLoweringMetaGraphBlueprint
      - lowerWithFixedMetaGraph
      - runFixedLoweringMetaGraph
    structure_mode: fixed
    cells:
      - resolve-stage
      - apply-vocabulary-patch
      - emit-blueprint
    behavior:
      - Is package-owned and is never supplied by an individual materialization call.
      - Uses one graph for arbitrary connected, non-branching service and projection tier chains.
      - Runs the compiler Cells on one separate Kernel instance.
      - Applies service-recipe implementation programs in resolved service-stage order, then projection-recipe representations in resolved projection-stage order.
      - Evaluates representation decorator selectors and emits static terminal Cell-view decorations.
      - Validates the emitted terminal Blueprint before executable preparation.
      - runFixedLoweringMetaGraph returns the terminal Blueprint plus compiler ExecutionSnapshot evidence.
    implementation_status:
      - Production lowerWithFixedMetaGraph compiles the package-owned compiler Cells to one Kernel Program and executes them on a separate Kernel instance.
      - The authored Blueprint and immutable external context enter through lowering:source; the terminal Blueprint is accepted only from the compiled:artifact token produced by emit-blueprint.
      - ContinuousGraphRuntime owns one shared traversal and token scheduler. Async runtime publication awaits yielded node outcomes; deterministic compiler publication drives that same traversal synchronously.
      - Synchronous Kernel publication requires SyncJsonataExpressionProvider and rejects operations, effects, events, program mutations, and asynchronous node outcomes.
      - Registered lowering operations implement recipe vocabulary semantics inside compiler Cells; they do not schedule a parallel graph or bypass Kernel token flow.
  deferred:
    - Reconfiguring the shared meta-graph.
    - Suggested patches targeting the meta-graph.
    - Agent, service, or human pipelines in the meta-graph.
    - Durable meta-graph revision management.

lowering_api:
  type:
    name: BlueprintLowering
    signature: >-
      type BlueprintLowering<Out extends ExecutableProgramDefinition =
      ExecutableProgramDefinition> = (blueprint: BlueprintArtifact) => Out
  function:
    name: lowerBlueprint
    signature: >-
      lowerBlueprint<Out extends ExecutableProgramDefinition>(
      blueprint: BlueprintArtifact,
      lowering: BlueprintLowering<Out>): ProgramMessageFor<Out>
  behavior:
    - Validates the input Blueprint.
    - Runs the supplied deterministic lowering.
    - Delegates terminal executable-program validation to Kernel lowerToProgram.
    - Preserves program message typing for Blueprints with and without presentation projections.
  boundary:
    - Fixed materialization executes synchronous service and projection recipes through compiler Cells, with the complete service chain preceding the complete projection chain.
    - This phase does not select or synthesize strategies and performs no asynchronous effects.
    - Kernel validation rejects invalid lowering output before lowerBlueprint returns a program message.

validation:
  structural:
    - Blueprint artifacts use packages/evaluators/schemas/blueprint.schema.json.
    - Cells use packages/evaluators/schemas/cell.schema.json.
    - Tiers use packages/evaluators/schemas/tier.schema.json.
    - Lowering recipes use packages/evaluators/schemas/lowering-recipe.schema.json, whose serviceRecipe and projectionRecipe definitions are the only two recipe dialects.
    - Unknown properties are rejected where schemas declare additionalProperties false.
  semantic:
    - Blueprint identity, a runtime declaration object, at least one tier per axis, and both recipe arrays are required.
    - The removed pre-split tiers and recipes fields are rejected with a message naming the four replacements; there is no compatibility normalization.
    - Tier ids and lowering-recipe ids are unique within their own axis; the two axes are independent id namespaces.
    - Lowering recipes reference known tiers on their own axis, do not branch or merge, and expose one source and one terminal tier when present.
    - An axis with no recipes must declare exactly one terminal tier.
    - Both axes are validated by one shared per-axis function, so service and projection are held to identical chain invariants.
    - Cell keys match Cell ids.
    - Cell composition has no error diagnostics.
    - Presentation slots, declared root, and every `region` reference (on a slot or a Cell view) resolve to a
      known slot id.
    - A Cell may attach its `region` to more than one slot; the presentation model imposes no
      duplicate-placement restriction.
    - Every Cell source's service/operation resolves to a declared entry in top-level services; an
      unresolvable reference is rejected.
    - When `presentation.allowedCapabilities` is present, every capability referenced by a Cell view or
      view decoration must appear in it.

execution_boundary:
  blueprint_input: BlueprintArtifact JSON accepted by this package.
  blueprint_output: A validated Kernel program message returned by lowerBlueprint.
  kernel_input: ExecutableProgramDefinition accepted by Kernel.
  rules:
    - A BlueprintArtifact is not an ExecutableProgramDefinition.
    - "@gik/blueprint exports pure materialize and transition APIs, but no renderer or live host."
    - A host supplies recipe resources, service bindings, durable persistence, and effect execution.
    - Kernel owns runtime state, revisions, event processing, effects, and checkpoints.

structure_mode_contract:
  type: '"fixed" | "reconfigurable" | "adaptive"'
  serialization: Optional BlueprintDefinition.structureMode field.
  default_annotation: The JSON schema annotates fixed as the default.
  behavior:
    - Validation preserves an explicit value and leaves an omitted value undefined.
    - Omission is interpreted as fixed by structure admission functions.
    - fixed means neither runtime behavior nor an authorized Face operation can change the program through Blueprint admission.
    - reconfigurable means ordinary runtime behavior cannot change the program; an authorized Face or host operation may submit a semantic Blueprint patch.
    - adaptive means runtime behavior may produce ProgramPatch operations admitted by BlueprintStructurePolicy.
    - Kernel does not receive or interpret Blueprint structure-mode labels through this package.
    - Cell impact and exploration APIs analyze supplied snapshots identically for all structure modes.
    - Nested child Blueprint mutation remains parked; existing recursive assembly behavior is unchanged.
  runtime_boundary:
    - Blueprint admits semantic and executable patches; Kernel validates and applies executable patches.
    - Reconfiguration updates an existing program through ProgramPatch rather than installing a full replacement program.

