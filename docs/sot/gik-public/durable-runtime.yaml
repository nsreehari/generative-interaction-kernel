schema_version: 1

document:
  name: gik-durable-runtime
  status: current-implementation
  scope: local runtime, notification-driven queue processor, connectors, storage backends, and server transports
  source_of_truth: >-
    This file describes the current implementation under
    packages/durable-runtime. TypeScript source remains authoritative when this
    document and implementation disagree.

package:
  name: "@gik/durable-runtime"
  version: "0.8.0"
  publication_status: public-workspace-package
  purpose: >-
    Run caller-supplied pure transitions and effect handlers locally while routing durable
    state, opaque specs, journals, transition leases, engine wake markers, and effect queues to
    IndexedDB, filesystem MCP, or Azure Functions according to KindValueRef kinds.
  core_promise: >-
    The host owns transition and effect execution. Providers own persistence, locking,
    optimistic revision checks, journal access, and queue settlement. A transition never
    spans provider kinds.
  public_entrypoint: packages/durable-runtime/src/index.ts
  implementation_entrypoint: packages/durable-runtime/src/runtime/browser-runtime.ts
  package_boundary: >-
    One public package uses explicit subpath exports for connectors, storage backends,
    and server transports so root browser imports do not load Cosmos or filesystem code.
  distribution:
    build: "turbo run build --filter=@gik/durable-runtime"
    publish: Standard public npm package through the GIK workspace release workflow.
    pack_command: npm run pack:durable-runtime
    artifact_policy: >-
      The pack command builds through Turbo and creates a versioned npm tarball plus a
      SHA-256 manifest under .artifacts/durable-runtime. Each consumer independently
      ingests a supplied tarball into its own repository, updates its own dependency and
      lockfile, and verifies its committed artifact. No repository assumes another
      repository's source directory exists.
    optional_dependencies: >-
      @azure/cosmos and @azure/storage-blob are optional peer dependencies of
      @gik/durable-runtime and direct dependencies of Azure consumers. Browser and
      filesystem-only consumers do not install them.
    runtime_dependencies: >-
      proper-lockfile is a package runtime dependency used by the filesystem storage
      library. @types/proper-lockfile is development-only declaration support.
  storage_exports:
    - "@gik/durable-runtime/storage/cosmos"
    - "@gik/durable-runtime/storage/cosmos/library"
    - "@gik/durable-runtime/storage/cosmos/api"
    - "@gik/durable-runtime/storage/filesystem"
    - "@gik/durable-runtime/storage/filesystem/library"
    - "@gik/durable-runtime/storage/filesystem/api"
    - "@gik/durable-runtime/storage/indexed-db"
    - "@gik/durable-runtime/storage/indexed-db/library"
    - "@gik/durable-runtime/storage/indexed-db/api"
  execution_contract: >-
    DurableTransitionAdapter is provider-neutral and has no Blueprint or Kernel semantics.
    The host supplies an opaque declarative spec, a pure transition function, and a pure
    applySpecUpdates function. Providers persist spec values and updates without interpreting them.
  blueprint_binding: >-
    @gik/blueprint may supply a structurally compatible adapter whose opaque spec contains an
    authored Blueprint, immutable external context, and portable MaterializedBlueprint. This is a
    caller binding, not a dependency or Blueprint semantic added to durable-runtime.

api_policy:
  signature_authority: TypeScript source in packages/durable-runtime/src
  categories:
    primary: Supported browser-runtime operation for current samples.
    provider_extension: Interface implemented by durable storage providers.
    host_extension: Transition, spec-update, effect handler, connection, or authentication behavior supplied by a host.
    advanced: Provider factory or transition primitive used to compose a host.
  compatibility: >-
    Contract changes must update this SOT, package exports, and focused tests together.

architecture:
  execution_owner: host
  provider_owner: durable storage and concurrency
  boundaries:
    - Caller-supplied transitions execute only in createDurableRuntime.runEngine.
    - Effect handlers execute only in createDurableRuntime.processQueueLaneItem.
    - createDurableQueueProcessor coalesces notifications and processes one item per pending notification.
    - Queue notification subscriptions are supplied by the host and carry no queue item data.
    - Azure Functions and filesystem MCP do not execute transitions on the browser-runtime path.
    - IndexedDB is accessed directly by its browser provider.
    - The filesystem adapter receives an already-connected MCP callTool function from the host.
    - The Azure adapter receives its base URL, dynamic headers callback, and optional fetch implementation from the host.
  operation_flow:
    initialize:
      - Resolve the provider from stateRef and effectsQueueRef kind.
      - Obtain initial state and initial opaque spec from the host-supplied transition adapter.
      - Create the revisioned state/spec checkpoint only when absent.
    transition:
      - Resolve one provider for state, journal, and effects refs.
      - Acquire a lease and read persisted state, spec, and journal entries after the cursor.
      - Run the supplied transition with state, spec, and the ordered event array.
      - Apply emitted specUpdates through the caller-supplied applySpecUpdates function.
      - Atomically commit state, materialized spec, specUpdates, cursor, and effects while releasing the lease.
      - Abort and release the lease if local execution throws.
      - A Blueprint-bound stateless worker may execute a trusted portable materialization read from
        spec without process-local memory or per-transition source hashing.
    append_and_wake:
      - Append the journal event unconditionally.
      - Advance the provider-owned requestedAt engine wake marker.
      - Do not acquire the transition lease or execute the transition from appendJournal.
    engine_wake:
      - Read requestedAt and processedAt from the selected provider.
      - Return idle when requestedAt is absent or is not later than processedAt.
      - Run one leased engine transition when requestedAt is pending.
      - Mark the captured requestedAt as processed only after a committed or idle engine result.
      - Preserve a newer request written while the engine transition is running.
    effect_processing:
      - Lease one effect queue message.
      - Route lease, acknowledgement, and negative acknowledgement through semantic durable-runtime operations.
      - Resolve those operations to the same provider queue implementation used by transition commit.
      - Resolve a local handler from message.body.type.
      - Append every returned event to the journal.
      - Acknowledge success or negatively acknowledge failure.
    queue_processor:
      - Subscribe to a host-supplied notification that means only that a queue may have work.
      - Coalesce duplicate notifications while one processing cycle is active.
      - Call processNext exactly once for each pending notification.
      - Stop and unsubscribe through an AbortSignal-backed lifecycle.
    snapshot_subscription:
      - Read snapshot changes after an opaque committed revision.
      - Return unchanged without transferring state when that revision is still current.
      - Return JSON Patch operations when the revision is exactly one retained commit behind.
      - Return a reset snapshot when the revision is older, unknown, or not supplied.
      - Serialize provider reads so polling and invalidation wakeups never overlap.
      - Coalesce invalidation bursts and catch up immediately after attachment or reconnection.
      - Retain periodic safety polling because invalidations are lossy hints.
      - Advance the local revision before notifying the subscriber.
      - Stop future polls synchronously when the returned unsubscribe function is called.

reference_protocol:
  encoding: "b64:<base64url(JSON)>"
  decoded_shape: "{ kind: string; value: string }"
  supported_provider_kinds:
    indexed-db: Direct browser IndexedDB provider.
    fs-path: Filesystem storage exposed through MCP tools.
    stores-proxy: Azure Functions storage proxy backed by Cosmos DB.
  routing_rules:
    - appendJournal requires stateRef, journalRef, and effectsQueueRef to share one kind.
    - initializeRuntime requires stateRef and effectsQueueRef to share one kind.
    - runEngine requires stateRef, journalRef, and effectsQueueRef to share one kind.
    - processEngineWake requires stateRef, journalRef, and effectsQueueRef to share one kind.
    - processQueueLaneItem currently validates effectsQueueRef and journalRef kinds.
    - Mixed-kind operations fail before provider I/O.

contracts:
  - name: KindValueRef
    signature: "type KindValueRef = { kind: string; value: string }"
    purpose: Select a provider and carry its provider-specific logical address.
    source: packages/durable-runtime/src/refs.ts

  - name: JournalEntry
    signature: "type JournalEntry<T = unknown> = { id: string; payload: T }"
    purpose: Record one unconditionally appended journal event.
    guarantees:
      - appendJournal does not deduplicate entries.
      - Entry identifiers are assigned by the selected provider.

  - name: RuntimeRefs
    signature: >-
      type RuntimeRefs = { stateRef: string; effectsQueueRef: string;
      effectsLane?: string }
    purpose: Identify state and effect storage for initialization.

  - name: TransitionRefs
    signature: "type TransitionRefs = RuntimeRefs & { journalRef: string }"
    purpose: Identify all durable resources participating in one transition.

  - name: InitializeRuntimeResult
    signature: "type InitializeRuntimeResult = { created: boolean; revision: string }"
    purpose: Report whether initial state was created and identify the persisted revision.
    behavior:
      - Initialization is create-if-absent.
      - Repeating initialization for the same runtimeId preserves existing state, spec, and revision.
      - An existing checkpoint owned by another runtimeId is rejected.

  - name: EngineWakeState
    signature: >-
      type EngineWakeState = { requestedAt: string | null;
      processedAt: string | null }
    purpose: Represent a coalescing durable request to run the transition engine.
    pending_rule: requestedAt is non-null and requestedAt > processedAt, with null processedAt treated as unprocessed.
    exclusions:
      - It is not a queue.
      - It has no lease, acknowledgement, or negative acknowledgement.

  - name: RuntimeSnapshot
    signature: >-
      type RuntimeSnapshot<TState, TSpec> = { state: TState; spec: TSpec;
      revision: string }
    purpose: Read the currently committed runtime state and opaque spec without acquiring a transition lease.
    behavior:
      - Reading a snapshot does not inspect, acquire, release, or modify a transition lock.
      - Pending journal entries are excluded.
      - A missing runtime or mismatched runtimeId is rejected.

  - name: RuntimeSnapshotChanges
    signature: >-
      type RuntimeSnapshotChanges<TState, TSpec> =
      { kind: "unchanged"; revision: string } |
      { kind: "changes"; baseRevision: string; revision: string;
      operations: RuntimeSnapshotPatchOperation[] } |
      { kind: "reset"; snapshot: RuntimeSnapshot<TState, TSpec> }
    purpose: Conditionally synchronize a consumer from an opaque committed revision.
    behavior:
      - unchanged carries no state or spec payload.
      - changes contains RFC 6902 add, remove, and replace operations over
        the document { state, spec }.
      - reset is authoritative and replaces the consumer's cached snapshot.
      - Reads do not inspect, acquire, release, or modify a transition lock.
      - Providers retain only the latest committed patch, keeping storage bounded.
      - Missing more than one commit produces reset rather than an incomplete patch chain.

  - name: applyRuntimeSnapshotChanges
    signature: >-
      applyRuntimeSnapshotChanges<TState, TSpec>(current: RuntimeSnapshot<TState, TSpec>,
      changes: RuntimeSnapshotChanges<TState, TSpec>): RuntimeSnapshot<TState, TSpec>
    purpose: Apply unchanged, one-revision patch, or reset results through one validated consumer helper.
    behavior:
      - Patch application rejects a base revision that does not match the current snapshot.
      - Patch operations are validated before application and do not mutate the input snapshot.

  - name: TransitionSnapshot
    signature: >-
      type TransitionSnapshot<TState, TSpec, TEvent> = { leaseToken: string;
      leaseExpiresAt: string; state: TState; spec: TSpec; revision: string | null;
      cursor: string | null; entries: JournalEntry<TEvent>[] }
    purpose: Return leased state, opaque spec, and journal work to the local transition.
    behavior:
      - acquireTransition returns null when another active lease owns the transition.
      - Acquisition fails when the runtime has not been initialized.
      - entries contains journal records after cursor in provider order.

  - name: TransitionCommit
    signature: >-
      type TransitionCommit<TState, TSpec, TEffect, TSpecUpdate> = TransitionRefs & { runtimeId: string;
      leaseToken: string; expectedRevision: string | null;
      previousCursor: string | null; nextCursor: string; state: TState;
      spec: TSpec; specUpdates: TSpecUpdate[]; effects: TEffect[] }
    purpose: Commit one locally computed transition under its acquired lease.
    exclusions:
      - initialState is not part of commit.
      - Transition execution and spec-update application are not part of provider commit.

  - name: TransitionCommitResult
    signature: >-
      type TransitionCommitResult = { ok: true; revision: string } |
      { ok: false; reason: "conflict" | "lease-lost"; revision: string | null }
    purpose: Report an accepted commit or a concurrency failure.

  - name: QueueLeasedMessage
    signature: >-
      type QueueLeasedMessage<T> = { id: string; body: T; enqueuedAt: string;
      attempt: number; leaseToken: string; leaseExpiresAt: string }
    purpose: Carry one leased effect to a local browser handler.

  - name: DurableTransitionAdapter
    category: host_extension
    signature: >-
      type DurableTransitionAdapter<TState, TSpec, TEvent, TEffect, TSpecUpdate> = {
      initialState(): TState; initialSpec(): TSpec;
      transition(input: { state: TState; spec: TSpec; events: readonly TEvent[] }):
      Awaitable<{ state: TState; effects: readonly TEffect[];
      specUpdates?: readonly TSpecUpdate[] }>;
      applySpecUpdates(input: { spec: TSpec; updates: readonly TSpecUpdate[] }):
      Awaitable<TSpec> }
    purpose: Supply initial values and deterministic, provider-neutral transition behavior.
    behavior:
      - initialState is evaluated only by explicit initializeRuntime.
      - transition runs in the host after provider acquisition.
      - effects may be an empty array.
      - applySpecUpdates owns all interpretation of opaque spec updates.
      - For a Blueprint binding, semantic spec updates target the authored Blueprint and the
        caller atomically supplies the resulting authored Blueprint plus new materialization.

  - name: DurableEffectHandler
    category: host_extension
    signature: >-
      type DurableEffectHandler<TEffect, TEvent> =
      (effect: TEffect, execution: { messageId: string; attempt: number; signal?: AbortSignal }) =>
      Promise<TEvent[] | void> | TEvent[] | void
    purpose: >-
      Handle one leased effect locally and optionally produce journal events. messageId remains
      stable across retries and is the idempotency key for external side effects. signal is aborted
      when the owning worker stops so cooperative handlers can stop without publishing settlement.

  - name: DurableProvider
    category: provider_extension
    purpose: Implement persistence and concurrency for one reference kind.
    methods:
      - >-
        appendJournal<T>(request: TransitionRefs & { entry: T }):
        Promise<JournalEntry<T>>
      - "readEngineWake(refs: RuntimeRefs): Promise<EngineWakeState>"
      - "markEngineWakeProcessed(refs: RuntimeRefs, processedAt: string): Promise<void>"
      - >-
        initializeRuntime<TState, TSpec>(request: RuntimeRefs & { runtimeId: string;
        initialState: TState; initialSpec: TSpec }): Promise<InitializeRuntimeResult>
      - >-
        readSnapshot<TState, TSpec>(request: RuntimeRefs & { runtimeId: string }):
        Promise<RuntimeSnapshot<TState, TSpec>>
      - >-
        readSnapshotChanges<TState, TSpec>(request: RuntimeRefs & { runtimeId: string;
        afterRevision: string | null }): Promise<RuntimeSnapshotChanges<TState, TSpec>>
      - >-
        acquireTransition<TState, TSpec, TEvent>(request: TransitionRefs & {
        runtimeId: string; leaseMs?: number }):
        Promise<TransitionSnapshot<TState, TSpec, TEvent> | null>
      - >-
        commitTransition<TState, TSpec, TEffect, TSpecUpdate>(request:
        TransitionCommit<TState, TSpec, TEffect, TSpecUpdate>):
        Promise<TransitionCommitResult>
      - >-
        abortTransition(request: TransitionRefs & { runtimeId: string;
        leaseToken: string }): Promise<boolean>
      - "leaseQueueItem?<TEffect>(request): Promise<QueueLeasedMessage<TEffect> | null>"
      - "ackQueueItem?(request): Promise<boolean>"
      - "nackQueueItem?(request): Promise<boolean>"
      - >-
        subscribeSnapshotInvalidations?(request, listener, options):
        void | (() => void) | Promise<void | (() => void)>
    queue_support: >-
      Queue methods are optional at the interface level. processQueueLaneItem rejects a
      provider that does not implement all three queue methods.

  - name: QueueProcessResult
    signature: >-
      type QueueProcessResult = { status: "idle" | "completed" |
      "retry" | "dead" }
    purpose: Minimal result contract consumed by the notification-driven queue processor.

  - name: QueueNotificationSubscription
    category: host_extension
    signature: >-
      type QueueNotificationSubscription = (notify: () => void,
      signal: AbortSignal) => void | (() => void) |
      Promise<void | (() => void)>
    purpose: Notify one processor that its configured queue may contain work.
    payload_semantics: The notification carries no item, count, lease, or authoritative state.

  - name: RuntimeSnapshotInvalidation
    signature: >-
      type RuntimeSnapshotInvalidation = { runtimeId: string; stateRef: string;
      observedRevision?: string }
    purpose: Lossy wake hint that causes an authoritative readSnapshotChanges catch-up.

browser_runtime:
  factory:
    name: createDurableRuntime
    category: primary
    source: packages/durable-runtime/src/runtime/browser-runtime.ts
    signature: >-
      createDurableRuntime(options: { runtimeId: string;
      providers: Record<string, DurableProvider>;
      transitionAdapter: DurableTransitionAdapter;
      effectHandlers?: Record<string, DurableEffectHandler> })
    compatibility_alias: createBrowserDurableRuntime
  methods:
    - name: appendJournal
      signature: >-
        appendJournal<T>(request: TransitionRefs & { entry: T }):
        Promise<JournalEntry<T>>
      purpose: Append one event without deduplication and request an engine wake through the selected provider.

    - name: initializeRuntime
      signature: >-
        initializeRuntime(request: RuntimeRefs):
        Promise<InitializeRuntimeResult>
      purpose: Explicitly create initial durable state and opaque spec for the selected runtime.
      behavior:
        - Calls transitionAdapter.initialState and transitionAdapter.initialSpec.
        - Uses runtimeId as the persisted implementation/version identity.
        - Does not require journalRef because initialization does not read the journal.
        - Does not overwrite an existing runtime.

    - name: readSnapshot
      signature: >-
        readSnapshot<TState, TSpec>(request: RuntimeRefs):
        Promise<RuntimeSnapshot<TState, TSpec>>
      purpose: Read committed state, opaque spec, and revision without acquiring a transition lease.

    - name: readSnapshotChanges
      signature: >-
        readSnapshotChanges<TState, TSpec>(request: RuntimeRefs & {
        afterRevision: string | null }): Promise<RuntimeSnapshotChanges<TState, TSpec>>
      purpose: Transfer one retained state/spec patch when possible while preserving authoritative reset behavior.

    - name: subscribe
      signature: >-
        subscribe<TState, TSpec>(request: RuntimeRefs,
        listener: (changes: RuntimeSnapshotChanges<TState, TSpec>) => Awaitable<void>,
        options?: { afterRevision?: string | null; pollIntervalMs?: number;
        onError?: (error: unknown) => void }): () => void
      purpose: Notify any UI, backend, worker, CLI, or headless consumer when committed snapshot state changes.
      behavior:
        - Uses serialized provider-neutral reads over readSnapshotChanges.
        - Wakes from optional provider invalidations and retains periodic safety polling.
        - Coalesces bursts and catches up after invalidation attachment and reconnection.
        - Suppresses listener calls for unchanged revisions.
        - Delivers an initial reset when afterRevision is omitted.
        - Reports read or listener failures through onError and continues polling.
        - The returned function prevents future listener calls and polling.

    - name: runEngine
      signature: >-
        runEngine(request: TransitionRefs & { leaseMs?: number }):
        Promise<RunEngineResult>
      purpose: Acquire durable work, execute one local transition, apply spec updates, and commit it.
      results:
        busy: Another active transition lease prevented acquisition.
        idle: No journal entries followed the persisted cursor; the lease was aborted.
        committed: State, spec, specUpdates, cursor, and effects committed successfully.
        conflict: Persisted revision or cursor changed before commit.
        lease-lost: The lease was absent, mismatched, or expired before commit.
      committed_fields:
        - revision
        - cursor
        - entryCount
        - effectCount
      failure_behavior:
        - A thrown transition or applySpecUpdates error triggers best-effort abort and is rethrown.
        - A failed abort does not replace the original execution error.

    - name: processEngineWake
      signature: >-
        processEngineWake(request: TransitionRefs & {
        leaseMs?: number }): Promise<RunEngineResult | { status: "idle" }>
      purpose: Run one engine transition only when the durable wake marker is pending.
      behavior:
        - Captures requestedAt before acquiring the transition.
        - Marks only that captured timestamp as processed.
        - Marks processed after committed and idle results.
        - Does not mark processed after busy, conflict, or lease-lost results.

    - name: processQueueLaneItem
      signature: >-
        processQueueLaneItem(request: { stateRef: string; effectsQueueRef: string;
        effectsLane?: string; journalRef: string; visibilityMs?: number;
        maxAttempts?: number }): Promise<ProcessQueueLaneItemResult>
      purpose: Execute at most one locally registered effect handler.
      results:
        idle: No queue message was available.
        completed: Returned events were appended and the message was acknowledged.
        retry: Handling failed before maxAttempts and the message was negatively acknowledged.
        dead: Handling failed at or beyond maxAttempts and the message was dead-lettered.
      handler_selection: message.body.type
      default_max_attempts: 5
      failure_behavior:
        - Missing or non-object effect types fail handling.
        - Journal appends happen before queue acknowledgement.
        - Returned events use semantic appendJournal behavior and therefore request engine wake.
        - An acknowledgement failure enters the same nack path as handler failure.

queue_processor:
  generic:
    factory: createDurableQueueProcessor
    category: primary
    source: packages/durable-runtime/src/queue-processor/queue-processor.ts
    options:
      - "processNext(): Promise<QueueProcessResult>"
      - "subscribe: QueueNotificationSubscription"
      - "onError?: (error: unknown) => void"
    methods:
      - "start(): Promise<void>"
      - "notify(): void"
      - "stop(): void"
      - "isRunning: boolean"
    behavior:
      - Starting subscribes once; repeated start calls are idempotent.
      - No queue read occurs until notify is called.
      - One processor instance runs at most one processing cycle concurrently.
      - Duplicate notifications coalesce into one pending follow-up cycle.
      - An effect is marked dead only after its terminal failure is appended to the journal inbox; unavailable or missing failure reporting leaves it retryable.
      - Thrown processNext errors call onError and allow later notification recovery.
      - Stopping aborts and unsubscribes; repeated stop calls are idempotent.
  browser_adapter:
    factory: createBrowserRuntimeQueueProcessor
    source: packages/durable-runtime/src/queue-processor/browser-runtime-adapter.ts
    purpose: Bind one queue processor to browserRuntime.processQueueLaneItem and fixed queue refs.
  scaling:
    - Multiple processor instances or hosts may respond to the same notification.
    - Authoritative queue leases determine which processor owns each item.
    - Notification delivery and queue ownership remain separate concerns.
  notification_transports: Host-supplied and not implemented by this package.

configured_runtime:
  factory:
    name: createConfiguredBrowserDurableRuntime
    category: primary
    source: packages/durable-runtime/src/runtime/configured-runtime.ts
  config:
    indexedDb:
      shape: "{ databaseName?: string; indexedDB?: IDBFactory }"
      registers_kind: indexed-db
    filesystem:
      shape: "{ mcpUrl: string; connect: (url: string) => Promise<McpCallTool> | McpCallTool }"
      registers_kind: fs-path
      ownership: The host creates and owns the MCP connection lifecycle.
    azure:
      shape: >-
        { baseUrl: string; getHeaders?: () => Record<string, string>;
        fetch?: typeof globalThis.fetch }
      registers_kind: stores-proxy
      ownership: getHeaders is evaluated for every request so credentials may rotate.
  behavior:
    - Only configured providers are registered.
    - Factory setup awaits filesystem MCP connection establishment.
    - Missing provider kinds fail when an operation attempts to route to them.

connectors_and_storage:
  - name: In-memory
    kind: memory
    factory: createInMemoryProvider
    connector_export: "@gik/durable-runtime/connectors/in-memory"
    source: packages/durable-runtime/src/storage/memory.ts
    purpose: >-
      Ephemeral host-local provider implementing the same journal, engine-wake, transition lease,
      atomic checkpoint/effect commit, queue lease/ack/nack, snapshot change, and invalidation
      contracts as persistent providers.
    durability: Process lifetime only; intended for tests, backend-local execution, and explicitly
      non-durable hosts.

  - name: IndexedDB
    kind: indexed-db
    factory: createIndexedDbStorage
    connector_export: "@gik/durable-runtime/connectors/browser-indexed-db"
    storage_export: "@gik/durable-runtime/storage/indexed-db"
    storage_library_export: "@gik/durable-runtime/storage/indexed-db/library"
    storage_api_export: "@gik/durable-runtime/storage/indexed-db/api"
    source: packages/durable-runtime/src/storage/indexed-db
    default_database: gik-durable-runtime
    object_store: records
    api_model: >-
      Direct browser API. The API subpath exports createIndexedDbStorage,
      createIndexedDbProvider, and their public options; it does not define a server
      transport or HTTP dispatcher.
    storage_layers:
      runtime:
        source: packages/durable-runtime/src/storage/indexed-db/runtime.ts
        responsibility: >-
          Durable journal/wake, state, transition lease, atomic effect commit, and
          effect queue settlement semantics.
      library:
        source: packages/durable-runtime/src/storage/indexed-db/library
        responsibility: >-
          IndexedDB open/upgrade, request completion, transactions, record ids,
          prefix ranges, and generic record scans without durable-runtime semantics.
      api:
        source: packages/durable-runtime/src/storage/indexed-db/api
        responsibility: Direct provider options and browser factory exports.
    transaction_model:
      - Journal append, its sequence counter, and requestedAt wake update share one readwrite transaction.
      - requestedAt advances to processedAt plus one millisecond only when wall-clock time is not later than processedAt.
      - processedAt advances monotonically in a readwrite transaction.
      - Initialization is create-if-absent in one readwrite transaction.
      - Acquire validates initialized state and writes the lease in one readwrite transaction.
      - Commit validates lease, revision, and cursor; writes state and effects; and deletes the lock in one readwrite transaction.
      - Abort validates the token and deletes the lock in one readwrite transaction.
    snapshot_invalidations: >-
      BroadcastChannel publishes runtimeId, stateRef, and resulting revision only after a
      successful committed transaction. Delivery and publication are best effort.
    default_transition_lease_ms: 300000
    default_queue_visibility_ms: 60000

  - name: Filesystem MCP
    kind: fs-path
    factory: createFilesystemMcpConnector
    connector_export: "@gik/durable-runtime/connectors/filesystem-mcp"
    storage_export: "@gik/durable-runtime/storage/filesystem"
    storage_library_export: "@gik/durable-runtime/storage/filesystem/library"
    storage_api_export: "@gik/durable-runtime/storage/filesystem/api"
    source: packages/durable-runtime/src/connectors/filesystem-mcp.ts
    transport: Host-injected MCP callTool function.
    tools:
      append_and_wake: filesystem.journal_append_and_wake
      wake_read: filesystem.engine_wake_read
      wake_processed: filesystem.engine_wake_processed
      initialize: filesystem.runtime_initialize
      acquire: filesystem.transition_acquire
      commit: filesystem.transition_commit
      abort: filesystem.transition_abort
      effect_lease: filesystem.effect_lease
      effect_ack: filesystem.effect_ack
      effect_nack: filesystem.effect_nack
    response_envelopes:
      initialize: "{ initialization: InitializeRuntimeResult }"
      acquire: "{ transition: TransitionSnapshot | null }"
      abort: "{ aborted: boolean }"
      append: "{ entry: JournalEntry }"
      wake_read: "{ wake: EngineWakeState }"
      wake_processed: "{ processed: true }"
    journal_behavior:
      - Journal records are direct newline-delimited fs.appendFile writes without a journal lock.
      - Append remains independent of the transition lock.
    wake_behavior:
      - requestedAt is the modification time of an empty engine-wake-requested.file marker.
      - processedAt is the modification time of an empty engine-wake-processed.file marker.
      - Request and processing updates use touch-style file creation plus mtime updates.
      - Marker contents are empty and are not read to determine wake state.
      - Marking processed sets the processed marker mtime to the captured requestedAt token.
    storage_layers:
      runtime:
        source: packages/durable-runtime/src/storage/filesystem/runtime.ts
        responsibility: >-
          Durable transition leases, state revisions, journal/wake composition, staged
          effect commit, and semantic effect queue access. The durable effects lane
          defaults explicitly to effects.
      library:
        source: packages/durable-runtime/src/storage/filesystem/library
        responsibility: >-
          Root-confined refs and paths, blob, KV, journal, queue, wake, relay lock,
          JSON, scratch, archive, namespace cleanup, and composed
          createFilesystemStorageLibrary. All storage is configurable by rootDir.
      api:
        source: packages/durable-runtime/src/storage/filesystem/api
        responsibility: >-
          Typed storage batch contracts and createFilesystemStorageDispatcher,
          separated from storage implementation and durable runtime semantics.
    server_implementation: Consumer-owned MCP host using the public storage/filesystem export.
    snapshot_invalidations: >-
      The connector can adapt notifications/gik/runtime_snapshot_invalidated from the MCP
      transport. The current server watches committed checkpoint files and emits debounced hints.

  - name: Azure Functions
    kind: stores-proxy
    factory: createAzureFunctionConnector
    connector_export: "@gik/durable-runtime/connectors/azure-function"
    storage_export: "@gik/durable-runtime/storage/cosmos"
    storage_library_export: "@gik/durable-runtime/storage/cosmos/library"
    storage_api_export: "@gik/durable-runtime/storage/cosmos/api"
    server_transport_export: "@gik/durable-runtime/server/transports/http"
    source: packages/durable-runtime/src/connectors/azure-function.ts
    transport: HTTP POST with JSON request and response bodies.
    routes:
      append: /api/gik/appendJournal
      wake_read: /api/gik/engine-wake/read
      wake_processed: /api/gik/engine-wake/processed
      initialize: /api/gik/runtime/initialize
      acquire: /api/gik/transition/acquire
      commit: /api/gik/transition/commit
      abort: /api/gik/transition/abort
      effect_lease: /api/gik/effects/lease
      effect_ack: /api/gik/effects/ack
      effect_nack: /api/gik/effects/nack
      invalidation_negotiate: /api/gik/runtime/invalidations/negotiate
    wake_behavior:
      - Cosmos stores requestedAt and processedAt in one engine wake document.
      - Wake updates use ETag-conditional replacement or create with bounded conflict retries.
      - requestedAt advances to processedAt plus one millisecond only when wall-clock time is not later than processedAt.
      - processedAt advances monotonically.
      - Journal append and wake request are separate operations and are not one Cosmos transactional batch.
    authentication: >-
      The host may return request headers from getHeaders. The adapter does not own or
      persist credentials.
    snapshot_invalidations: >-
      Optional SignalR mode negotiates through the Functions endpoint and listens for
      gikRuntimeSnapshotInvalidated. The server publishes through managed-identity REST only
      after successful commits; publication failure does not alter the commit result.
    storage_layers:
      runtime:
        source: packages/durable-runtime/src/storage/cosmos/runtime.ts
        responsibility: >-
          Cosmos transition state, leases, atomic effect commit, semantic effect queue
          settlement, and engine wake storage.
      library:
        source: packages/durable-runtime/src/storage/cosmos/library
        responsibility: >-
          Cosmos KV, journal, queue, relay lock, JSON, scratch, archive, ref resolution,
          Blob-backed storage, namespace cleanup, and composed CosmosStorageLibrary.
      api:
        source: packages/durable-runtime/src/storage/cosmos/api
        responsibility: >-
          Storage HTTP request and response contracts, server dispatch, and the remote
          storage client. API-facing code depends on library contracts without owning
          provider implementation.
    server_implementation: >-
      Consumer-owned Azure host creates SDK clients, composes createCosmosStorageLibrary,
      registers Azure Function routes, and imports all reusable storage and runtime behavior
      from the vendored public package. It has no private durable-runtime workspace package.

concurrency_and_durability:
  initialization:
    - Must occur explicitly before acquireTransition or runEngine.
    - Is create-if-absent and never overwrites existing state.
    - Produces the first durable revision with a null cursor.
  transition_lease:
    - Only one active transition lease may own a runtime namespace.
    - Lease token and expiry are validated during commit.
    - Successful commit releases the transition lease.
    - Conflict releases the transition lease where supported by the provider protocol.
    - Abort releases a matching lease without changing state or cursor.
  optimistic_checks:
    - expectedRevision must equal the persisted revision.
    - previousCursor must equal the persisted cursor.
    - nextCursor is the id of the last journal entry processed by the local transition.
  effects:
    - Effects are persisted with state and cursor by the provider commit operation.
    - Effect handlers run separately through queue leasing.
    - Provider semantic effect operations use the same physical queue and schema as transition commit.
  journal:
    - Append is unconditional.
    - The runtime does not provide event-level deduplication.
    - Append does not acquire the transition lease.
  engine_wake:
    - requestedAt and processedAt are millisecond ISO timestamps at the cross-provider contract boundary.
    - Pending means requestedAt is later than processedAt.
    - Multiple requests may coalesce into one pending marker.
    - Engine wake has no lease, ack, nack, item identity, or delivery count.
    - Transition locking remains authoritative when multiple hosts attempt engine work.
  queue_processing:
    - Notifications are non-authoritative hints that a configured queue may have work.
    - Queue lease, ack, nack, visibility timeout, retry, and dead-letter state remain provider-owned.
    - Multiple processors may process the same lane concurrently because item leases arbitrate ownership.

host_responsibilities:
  - Supply one DurableTransitionAdapter and unique runtimeId for each durable runtime.
  - Call initializeRuntime explicitly before runEngine for a new runtime.
  - Supply effect handlers keyed by effect body type.
  - Supply a terminal effect failure reporter whenever effect handlers are configured.
  - Supply queue notification subscriptions and own their transport connectivity.
  - Supply provider URLs, MCP connection behavior, authentication headers, and optional browser APIs.
  - Configure optional snapshot invalidation transports when lower-latency catch-up is required.
  - Keep all refs in one operation on the same provider kind.
  - Decide when to call processEngineWake or runEngine.
  - Start and stop queue processors with the host lifecycle when notification-driven processing is required.
  - Compose @gik/blueprint/worker when Blueprint engine and effect work needs host-owned execution.
  - Treat provider and transition-adapter errors as operational failures requiring host policy.

non_goals:
  - Server-side transition execution on the browser-runtime path.
  - Cross-provider atomic transitions.
  - Journal deduplication.
  - Lease renewal.
  - Transition idempotency keys.
  - Automatic polling, scheduling, or service-worker ownership.
  - Built-in SSE, BroadcastChannel, MCP notification, or other queue notification transports.
  - A provider-neutral durable notification queue; notifications are only wake hints.
  - Firestore snapshot invalidation or storage integration.
  - Owning MCP transport lifecycle or Azure credentials.
  - Interpreting caller-owned specs, events, effects, or spec updates.

limitations:
  - The workspace package has not yet been released to npm.
  - Public browser runtime result types are inferred rather than exported as named contracts.
  - The filesystem server holds transition release closures in process memory; server restart abandons that in-memory ownership and relies on filesystem lock behavior.
  - >-
    Deferred low-priority follow-up: filesystem crash-consistency hardening. Keep this tracked,
    but prioritize proving runtime value and operational demand before designing or implementing it.
  - Effect event appends occur before queue acknowledgement. A later acknowledgement failure returns retry without reclassifying the completed effect as failed; DurableEffectHandler receives a stable messageId and the Blueprint worker skips invocation after that settlement identity is committed.
  - Queue processors do not renew item leases during long-running handlers.
  - Generic queue processors do not add retries or timers after retry, idle, or thrown results; another notification is required. BlueprintWorker schedules a delayed wake hint for retry and engine-ownership contention, without draining unrelated backlog.
  - The Azure journal append and engine wake request are separate operations; a failure between them leaves the event durable without advancing the wake marker until another request or explicit engine run.
  - The runtime does not automatically initialize state from runEngine.
  - No provider is selected by configuration alone; selection always comes from the ref kind.

