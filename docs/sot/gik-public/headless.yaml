schema_version: 1

package:
  name: "@gik/headless"
  version: "0.1.0"
  status: current
  purpose: >-
    Provide the public GIK package boundary for backend services, middleware, workers,
    command-line applications, and other non-React hosts.
  core_promise: >-
    Backend consumers can reach the stable Kernel, evaluator, Face, and transport package
    surfaces through one Node-safe entrypoint without loading React, Fluent, projection
    components, CSS, or browser-host code.
  public_entrypoint: packages/headless/src/index.ts

api_policy:
  signature_authority: generated TypeScript declarations
  canonical_import: 'import { kernel, agentface, controlface } from "@gik/headless"'
  namespace_exports:
    kernel: "@gik/kernel"
    evaluators: "@gik/evaluators"
    agentface: "@gik/agentface"
    controlface: "@gik/controlface"
    transportHttpSse: "@gik/transport-http-sse"
    transportMcpHttp: "@gik/transport-mcp-http"
  export_rule: >-
    Each export is a namespace over the corresponding public package. @gik/headless does not
    copy, rename, wrap, or independently version underlying API members.
  subpath_rule: >-
    Package-specific subpaths remain owned by their source package. Consumers that require a
    subpath not exposed by a root namespace import that source package directly.

architecture:
  role: >-
    @gik/headless is the backend and middleware entrypoint, analogous to @gik/react as the
    frontend rendering and React-host entrypoint.
  owns:
    - The public package identity for common non-React GIK composition.
    - A Node-safe namespace facade over the supported backend package surfaces.
    - The dependency guarantee that importing the package does not evaluate frontend code or CSS.
  does_not_own:
    - Kernel execution, authoring, state, resolution, or transition semantics.
    - Evaluator or declarative-validator behavior.
    - ControlFace, AgentFace, service-host, queue, or projection policy.
    - HTTP, SSE, MCP, JSON-RPC, socket, or process lifecycle behavior.
    - React rendering, Blueprint React hosts, projection components, Fluent themes, or stylesheets.
    - Application credentials, endpoint authorization, deployment, persistence, or provider selection.
    - Compatibility wrappers around source-package APIs.
  dependency_direction:
    - "@gik/headless -> @gik/kernel"
    - "@gik/headless -> @gik/evaluators"
    - "@gik/headless -> @gik/agentface"
    - "@gik/headless -> @gik/controlface"
    - "@gik/headless -> @gik/transport-http-sse"
    - "@gik/headless -> @gik/transport-mcp-http"
    - "Backend source packages must not depend on @gik/headless."
    - "@gik/headless must not depend on @gik/react or @gik/components."
  invariants:
    - Importing @gik/headless in plain Node does not require a CSS loader or DOM renderer.
    - The package contains no independent runtime implementation or mutable singleton state.
    - Namespace behavior and types remain authoritative in the corresponding source packages.
    - Adding a namespace requires the source package to be public, non-React, and safe to evaluate in Node.
    - Host policy remains explicit in the consuming backend or middleware application.

consumer_guidance:
  use_when:
    - Starting a backend service, middleware host, worker, or command-line application that uses several GIK backend surfaces.
    - A stable public backend entrypoint is more useful than several source-package imports.
  use_source_packages_when:
    - The consumer needs only one underlying package and wants the smallest declared dependency set.
    - The consumer needs a source-package subpath that is not represented by a root namespace.
  use_react_when:
    - Rendering resolved GIK trees in React.
    - Hosting a Blueprint through the in-memory or durable React host.
    - Composing React projection providers, components, contexts, or bridges.
  prohibited_assumptions:
    - Importing @gik/headless does not construct a Kernel, Face, transport server, or worker.
    - Importing @gik/headless does not select AgentFace versus ControlFace policy for a host.
    - Importing @gik/headless does not make browser-oriented component authoring APIs Node-safe.

composition_examples:
  stateless_agent_mcp:
    packages: [agentface, transportMcpHttp]
    ownership: >-
      The application creates a stateless AgentFace dispatcher, supplies its selected tools,
      mounts an MCP HTTP server, and owns the Node HTTP server lifecycle.
  live_control_service:
    packages: [kernel, controlface, agentface, transportHttpSse, transportMcpHttp]
    ownership: >-
      The application creates and owns the live runtime, selects each Face projection, mounts
      transports, supplies service policy, and handles startup and shutdown.
  worker:
    packages: [kernel, evaluators]
    ownership: >-
      The worker owns queue or trigger integration and invokes the underlying GIK APIs explicitly;
      @gik/headless contributes no scheduler, persistence, or retry policy.

related_sot:
  - docs/sot/gik-public/kernel.yaml
  - docs/sot/gik-public/evaluators.yaml
  - docs/sot/gik-public/faces.yaml
  - docs/sot/gik-public/react.yaml

related_decisions:
  - ADR-0037-face-projections-and-transport-boundary.md
  - ADR-0040-external-services-and-queueface.md
  - ADR-0041-blueprint-first-hosting-and-controlface-lowering.md