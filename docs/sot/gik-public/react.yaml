schema_version: 1

package:
  name: "gik-react"
  consumer_documentation: packages/react/README.md
  version_authority: packages/react/package.json
  status: current
  purpose: >-
    Render resolved GIK trees in React and provide Blueprint-first in-memory and durable host
    entrypoints over the same bundle-composition surface.
  root_entrypoint: packages/react/src/index.ts
  root_implementation_entrypoint: adapters/react/src/index.ts
  durable_entrypoint: packages/react/src/durable.ts

api_policy:
  signature_authority: generated TypeScript declarations
  categories:
    rendering: Component registry, resolved-node renderer, useGenUI, and GenUIRoot.
    sources: GenUISource, GenUIController, BlueprintController, and source lifecycle contracts.
    blueprint_host: In-memory BlueprintHost and BlueprintHostProps from the root entrypoint.
    durable_blueprint_host: Durable BlueprintHost and BlueprintHostProps from the durable subpath.
    composition: Bundle, bundle registry, BundleCompositionHost, organisms, contexts, and bridges.
    host_services: Effect dispatch, leaf providers, native hooks, and file services.

architecture:
  owns:
    - React projection of resolved GIK nodes through a component registry.
    - The thin useGenUI binding from a structural GenUISource to React state and event emission.
    - React bundle registration and multi-organism composition.
    - Blueprint-first React hosts for in-memory and durable execution.
    - React-facing provider, context, bridge, native-effect, and file-service integration.
  does_not_own:
    - Blueprint validation, deterministic materialization, lowering, or transition semantics.
    - Kernel resolution or state-reduction semantics.
    - Durable checkpoint persistence, leasing, revisions, snapshot patches, or subscriptions.
    - Storage, transport, credentials, deployment, or provider selection policy.
  dependency_direction:
    - "gik-react -> gik-blueprint"
    - "gik-react -> gik-kernel"
    - "gik-react/durable -> gik-durable-runtime"
  invariants:
    - Rendering depends on the structural GenUISource contract, not a concrete transport or store.
    - Both Blueprint hosts materialize through gik-blueprint and render through BundleCompositionHost.
    - The durable subpath changes transition-state ownership, not the React composition model.
    - React controllers never implement queue leasing, acknowledgement, retries, or engine-wake loops.
    - Infrastructure adapters stay below gik-durable-runtime and are supplied through runtime options.
    - Component-internal UI interactions require no named host effect.
    - Capability-selected presentation-host bindings coordinate attention, run admitted host effects, or forward addressed semantic events.
    - Presentation effect registrations are trusted host code, never Blueprint-authored executable handlers.
    - Host-local presentation state is separate from Blueprint state, immutable external context, durable snapshots, and worker effects queues.
    - Wrappers and decorations never automatically inherit Cell handlers or semantic event ownership.
    - Nested Blueprint hosts and companion organisms do not implicitly inherit another instance's presentation host.

presentation_host:
  implementation: adapters/react/src/presentation-host.tsx
  purpose: Lifecycle-owned attention and admitted rendering-local effects, independent of Blueprint execution placement.
  configuration:
    - Capabilities select host-supplied declarative prop and event bindings, independent of generated node ids.
    - Prop bindings project declared attention channels, not arbitrary application-state paths.
    - Event bindings choose attention set/clear, a registered namespaced host effect, or explicitly addressed semantic ingress.
    - Unbound events retain existing controller routing and Cell contracts.
  attention:
    - Channels are declared by the rendering host and carry JSON identity/intent without report-specific domains.
    - Each channel holds the last writer's value; clear/release only removes the owning source's value.
    - Source-node unmount releases its attention, without clearing attention subsequently acquired by another source.
    - Host code may supply explicit non-component owners and must release them at the end of their lifetime.
    - Component-internal state remains component-owned; unrelated host application state remains outside this facility.
    - Attention set/clear requires no bespoke named effect and never changes semantic Blueprint state.
  registration:
    - Trusted provider modules declare an id and named effects with input parsers, authorization, and handlers.
    - Hosts explicitly admit provider/effect pairs; default admission is empty.
    - Registration is instance-scoped, rejects duplicates and undeclared admitted names, and returns an idempotent unregister function.
    - Admission, input parsing, and authorization precede handler execution.
    - Missing providers, denied operations, parse failures, and handler failures reject, never silently dispatching Cell events.
    - Handler context carries source identity and actor provenance, not a Blueprint store or semantic invocation context.
    - Rendering-local handlers cannot return semantic results; semantic work requires explicit Cell dispatch.
  scope:
    - Both in-memory and durable Blueprint hosts/providers accept presentationHost.
    - The rendering host handles these effects even when a remote worker owns semantic transitions.
    - All exported regions of one BlueprintProvider share its presentation host.
    - Nested hosts reset the scope; companion organisms may explicitly supply their own presentationHost.
    - Projection views receive a hostState.attention snapshot, not mutable access to the Blueprint state.
    - No Kernel grammar, Blueprint schema, or materialized event-ownership change is required.

blueprint_host:
  import: "gik-react"
  implementation: adapters/react/src/primitives/blueprint-host.tsx
  controller: adapters/react/src/blueprint-controller.ts
  state_ownership: Process-local durable state owned by an ephemeral in-memory provider.
  transition_flow:
    - Materialize the Blueprint once for the current blueprint and externalContext inputs.
    - Seed local state from materialized initialState or deprecated context compatibility input.
    - Append UI events to the in-memory journal inbox.
    - Run materialized transitions and effects through the same BlueprintWorker contract as durable hosts.
    - Append effect settlements to the journal and apply them through a later transition.
    - Resolve the resulting program through gik-kernel.
    - Notify the React binding and render through the shared bundle-composition host.

durable_blueprint_host:
  import: "gik-react/durable"
  implementation: adapters/react/src/primitives/durable-blueprint-host.tsx
  controller: adapters/react/src/durable-blueprint-controller.ts
  state_ownership: Committed state and materialized spec owned by the configured durable provider.
  transition_flow:
    - Materialize the Blueprint for bundle rendering through the shared gik-blueprint path.
    - Create a provider-neutral durable runtime with the Blueprint transition adapter.
    - Initialize the runtime and append the bootstrap event when newly created.
    - Append UI events to the durable journal and notify an optional locally mounted worker.
    - Read the committed snapshot without acquiring or aborting a writer lease.
    - Rebuild the resolved Kernel tree and notify the shared React binding.
  synchronization:
    available_below_host: >-
      gik-durable-runtime exposes readSnapshotChanges, applyRuntimeSnapshotChanges, and subscribe
      as framework-neutral APIs.
    current_host_behavior: >-
      DurableBlueprintController subscribes after startup, refreshes from authoritative snapshot
      changes after commits made by other processes, and stops the subscription with the GenUISource
      lifecycle.
  worker_ownership: >-
    BlueprintHost starts and stops only a supplied local BlueprintWorker. Omitting worker supports
    middleware, backend, or Azure Function execution using the same runtimeId and refs. The
    controller appends and notifies but never executes queue items or engine transitions.
  observation_ownership: >-
    Neither React mounting nor the generic worker establishes Sense observers automatically.
    The execution host reconciles committed intent and owns observation shutdown and journal ingress.

related_decisions:
  - ADR-0006-render-adapter-infra-agnostic.md
  - ADR-0008-first-render-adapter-react.md
  - ADR-0041-blueprint-first-hosting-and-controlface-lowering.md
  - ADR-0044-provider-neutral-durable-transition-runtime.md
  - ADR-0046-deterministic-blueprint-materialization.md
  - ADR-0047-durable-snapshot-synchronization.md
