schema_version: 1

package:
  name: "@gik/components"
  version: "0.1.0"
  purpose: >-
    Provide public, self-describing declarative projection components implemented with
    Fluent 2 React v9.
  core_promise: >-
    Each component owns one closed authoring contract: renderer, JSON Schema, recognized
    semantic tokens, presentation variants, emitted events, agent guidance, validation, and trial
    materialization.
  public_entrypoint: packages/components/src/index.ts
  public_subpaths:
    semantic: "@gik/components/semantic"
    primitives: "@gik/components/primitives"
    fluent: "@gik/components/fluent"
  generic_react_adapter:
    export: GikComponent
    entrypoint: "@gik/components"
    purpose: >-
      Select a primitive or semantic component by its closed capability ID and map generic
      typed spec and data props into the selected definition without starting a kernel runtime.
  declarative_react_adapter:
    export: GikComponentDeclarative
    runtime_provider: GikComponentRuntimeProvider
    entrypoint: "@gik/components"
    declaration_prop: nodeJson
    purpose: >-
      Execute one canonical JSON DocNode through an internally generated package vocabulary,
      projected program, and GIK kernel runtime.

api_policy:
  signature_authority: generated TypeScript declarations
  public_registries:
    - semanticComponentViews for explicit host projection-provider registration.
    - semanticComponentDefinitions for agent discovery, validation, and trial materialization.
    - semanticComponentCapabilities for programmatic manifest construction.
    - semanticComponentAuthoringTools as the semantic-components convenience AgentFace tool catalog.
    - primitiveComponentViews, primitiveComponentDefinitions, and primitiveComponentCapabilities.
    - primitiveComponentAuthoringTools as the primitive-components convenience AgentFace tool catalog.
    - fluentComponentViews, fluentComponentDefinitions, and fluentComponentCapabilities.
    - fluentComponentAuthoringTools as the Fluent-controls convenience AgentFace tool catalog.
    - componentViews, componentDefinitions, and componentCapabilities as aggregate Fluent, primitive, and semantic compatibility registries.
  authoring_functions:
    - listSemanticComponents
    - describeSemanticComponent
    - validateSemanticComponentProps
    - preflightSemanticComponent
    - materializeSemanticComponentTrial
    - getSemanticComponentAgentInstructions
    - createSemanticComponentAuthoringTools
    - getSemanticComponentAgentKit
    - listPrimitiveComponents
    - describePrimitiveComponent
    - validatePrimitiveComponentProps
    - preflightPrimitiveComponent
    - materializePrimitiveComponentTrial
    - getPrimitiveComponentAgentInstructions
    - createPrimitiveComponentAuthoringTools
    - getPrimitiveComponentAgentKit
    - listFluentComponents
    - describeFluentComponent
    - validateFluentComponentProps
    - preflightFluentComponent
    - materializeFluentComponentTrial
    - getFluentComponentAgentInstructions
    - createFluentComponentAuthoringTools
    - getFluentComponentAgentKit
  gik_component_props:
    required: [kind]
    structured: [spec, data, componentProps]
    presentation: [variant]
    composition: [children]
    identity: [id]
    event_bridge: [onEvent]
    effect_rule: >-
      GikComponent does not execute effects. Bundle reactions remain in document edges.on;
      non-bundle React hosts may bridge onEvent to their dispatcher.
  gik_component_declarative_props:
    required: [nodeJson]
    declaration_type: Json
    canonical_edges: [read, readExpr, gate, write, on, react, children]
    generic_layout:
      path: nodeJson.props.layout.slots
      assignment: "{ key: string, slot: string }"
      behavior:
        - Child keys are canonical child node ids; component-owned item keys use the same resolver.
        - Named slots preserve the authored order of matching children or items.
        - Missing layout metadata leaves every child in its original order in the default children slot.
        - The explicit children slot is equivalent to default child placement.
  gik_component_runtime_provider_props:
    json_state: [state]
    native_runtime: [effectHandlers, contexts, resolveProvider]
    effect_rule: >-
      Invoke actions use the canonical { do: invoke, args: { tool } } grammar. Referenced tools
      are declared as vocabulary externals and resolved from provider effectHandlers.

architecture:
  layers:
    fluent:
      definition: Reusable Fluent 2 controls that retain fluent provider capability names.
      current: [button, dropdown, icon-button, switch, toggle]
    primitives:
      definition: Domain-neutral rendering and interaction mechanics without business meaning.
      current: [chart, drawer, editable-table, form, growing-container, timer-button]
      candidates: [badge, list, card]
    semantic:
      definition: Domain-neutral information structures whose meaning is supplied by bundle data and configuration.
      examples:
        - A timeline can represent incidents, alerts, consequences, releases, or any temporal record set.
        - A sequence can represent procedures, stages, or ordered reasoning.
      rule: Domain projections and business workflows belong in bundles, recipes, or domain packages.
  owns:
    - Declarative component specifications and closed schemas.
    - Component-local semantic token vocabularies.
    - Component-local closed presentation variant vocabularies and selection guidance.
    - Fluent 2 React renderers.
    - Agent-facing use, avoid, and authoring rules.
  host_assumptions:
    - A FluentProvider supplies the active Fluent 2 theme.
    - Projection providers are registered explicitly; nothing is ambient.
  styling_contract:
    - Components use Fluent makeStyles and theme tokens for component-owned visual treatment.
    - Every component accepts native root className and style props.
    - Root classes use mergeClasses with the consumer class last so callsite Griffel rules win.
    - Nested customization uses declared Fluent slot props where a component exposes slots.
    - The package does not expose a synthetic or Fluent v8-style styles prop.
  does_not_own:
    - A theme or palette.
    - A global semantic provider.
    - Domain-value meanings outside a component's declared mapping.
    - Bundle state, effects, or event routing.
  dependency_direction:
    - "@gik/components -> @gik/react"
    - "@gik/components -> @gik/evaluators"
    - "@gik/components -> @gik/kernel"
    - "@gik/components -> @fluentui/react-components (peer)"
  classification_review:
    status: required-before-next-component-tranche
    reason: Existing domain-heavy semantic names must be evaluated against the domain-neutral structure rule.
agent_authoring:
  boundary:
    - Component discovery, validation, and trial materialization are pure ACX authoring operations.
    - The tools do not inspect or drive a live AX runtime.
    - The package does not create host-specific copilot-instructions, skills, or agent files.
    - Hosts request an agent kit for the component capabilities available to that authoring context.
    - Generated instructions and scoped tools derive from the same component definitions.
    - Hosts add kit.instructions to the agent context and contribute kit.tools through AgentFace extraTools.
    - Tool schemas and handlers reject capabilities outside the requested component list.
  variant_selection:
    - Read defaultVariant and variants from the component definition or describe() result.
    - Choose only a declared variant whose useWhen guidance matches the target surface.
    - Omit variant when the declared default is appropriate.
    - Validate authored props before committing them to a bundle.
    - Do not use variants to encode domain meaning, semantic status, event behavior, or theme.
  closed_variants:
    timeline: [standard, compact, minimal]
    sequence: [standard, compact]
    entity-constellation: [grouped, compact]
    decision-summary: [detailed, concise]
    action-board: [board, list]
    metric-comparison: [standard, compact, ranked]
    narrative-section: [standard, compact]
    evidence-trail: [detailed, compact]
    annotated-source-excerpt: [annotated, compact]
    chart: [standard, compact]
    semantic-graph: [network, relations]
  chart_kinds:
    chart: [bar, line, pie]
    rule: Chart kind is selected through spec.kind; variant controls presentation density only.

primitive_components:
  - chart
  - editable-table
  - form
  - growing-container
  - timer-button

semantic_components_pending_classification_review:
  - timeline
  - sequence
  - entity-constellation
  - decision-summary
  - action-board
  - metric-comparison
  - narrative-section
  - evidence-trail
  - annotated-source-excerpt
  - semantic-graph