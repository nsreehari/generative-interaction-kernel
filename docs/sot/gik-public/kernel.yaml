schema_version: 1

package:
  name: "@gik/kernel"
  version: "0.1.0"
  status: experimental
  purpose: >-
    Provide the authoritative GIK program runtime, vocabulary contracts,
    host extension ports, optional projection subsystem, renderer-side replica,
    transport broker, and program authoring helpers.
  core_promise: >-
    Turn an executable Blueprint into one authoritative, continuously settling
    causal system: deterministically propagate every currently reachable
    consequence until execution is quiescent, suspended on external work, or
    yielded at a configured budget boundary.
  public_entrypoint: packages/kernel/src/index.ts
  implementation_entrypoint: kernel/src/index.ts

api_policy:
  signature_authority: generated TypeScript declarations
  categories:
    primary: Supported application-facing API.
    host_extension: Interface implemented or supplied by a host.
    advanced: Supported infrastructure API not needed by ordinary consumers.
    internal_candidate: Exported today but not yet accepted as a durable contract.

capability_model:
  mental_model: >-
    Authoring and strategy produce Profiles, recipes, and higher-level artifacts;
    lowering compiles them into a validated executable Blueprint; Kernel execution
    settles that Blueprint against host-owned services; optional projection, transport,
    replication, and observation expose the result to consumers.
  categories:
    - name: contracts-and-protocol
      phase: cross-cutting
      role: supporting
      purpose: Define executable programs, vocabularies, events, patches, progress, traces, and wire envelopes.
      modules: [kernel/src/types.ts]
    - name: authoring
      phase: before-execution
      role: supporting
      purpose: Construct actions, projected or headless programs, and validated program messages.
      modules: [kernel/src/authoring.ts, kernel/src/vocabulary-gen.ts]
    - name: lowering-and-validation
      phase: before-execution
      role: supporting
      purpose: >-
        Compile higher-level frontend or backend artifacts into projected or headless
        executable programs and validate the terminal artifact before execution.
      modules: [kernel/src/lower.ts, kernel/src/validate.ts]
    - name: authoritative-execution
      phase: execution
      role: core
      purpose: Own revisioned state, event reduction, continuous graph settlement, effects, and invocations.
      modules: [kernel/src/kernel.ts, kernel/src/graph-runtime.ts, kernel/src/reduce.ts, kernel/src/derivations.ts]
    - name: host-orchestration
      phase: execution
      role: extension
      purpose: Delegate expressions, state storage, capabilities, external work, and transport to host-supplied ports.
      modules: [kernel/src/providers.ts]
    - name: projection
      phase: after-execution
      role: optional
      purpose: Resolve projected programs into renderer-neutral trees; headless programs omit this category.
      modules: [kernel/src/interpret.ts]
    - name: transport-and-replication
      phase: after-execution
      role: optional
      purpose: Carry protocol messages and maintain renderer-side state and revision replicas.
      modules: [kernel/src/transport.ts, kernel/src/client.ts]
    - name: lifecycle-and-observability
      phase: cross-cutting
      role: supporting
      purpose: Inspect execution, manage checkpoints and effects, and publish traces and progress.
      modules: [kernel/src/kernel.ts, kernel/src/observability.ts]
  package_direction:
    - Keep contracts, validation boundary, authoritative execution, and host interfaces in Kernel.
    - Treat authoring and lowering as the first physical split candidate after their contracts stabilize.
    - Treat projection and client replication as later optional split candidates driven by deployment needs.
    - Do not split packages merely to mirror source modules.

runtime_contracts:
  - name: ProgramDefinition
    signature: >-
      interface ProgramDefinition { vocabulary?: string; graph?: ProgramGraph;
      handlers?: RuntimeHandler[];
      reactions?: RuntimeReaction[]; machines?: Machine[];
      derivations?: StandingDerivation[] }
    purpose: Shared executable behavior independent of projection.
  - name: ProgramGraph
    signature: >-
      interface ProgramGraph { inputs?: PortToken[]; outputs?: PortToken[];
      ports?: Record<PortToken, PortDefinition>; nodes: ProgramNode[] }
    purpose: >-
      Declare one continuous dataflow topology whose explicit port tokens determine
      readiness, propagation, feedback, and dormancy.
    current_behavior:
      - inputs marks tokens as externally producible for inspection; publish accepts any token.
      - outputs prevents an otherwise unconsumed token from being diagnosed as unused.
      - ports configures token metadata; producer cardinality is declared but not yet enforced.
      - nodes are selected deterministically by lexicographic id order.
  - name: ProgramNode
    signature: >-
      interface ProgramNode { id: string;
      inputs?: Record<string, PortToken | InputPort>;
      outputs?: Record<string, PortToken | OutputPort>; trigger?: NodeTrigger;
      when?: string; operation: NodeOperation }
    purpose: Declare a schedulable operation and its local-to-global port bindings.
  - name: PortToken
    signature: "type PortToken = string"
    purpose: Name a graph value, signal, or ordered stream independently of expressions.
  - name: PortMode
    signature: 'type PortMode = "value" | "signal" | "stream"'
    purpose: Select structural-change, every-publication, or accumulated-publication propagation.
    behavior:
      - value increments the token version only when structural JSON equality changes.
      - signal increments the token version for every publication, including equal values.
      - stream appends each publication to the token's JSON array value and increments its version.
  - name: PortDefinition
    signature: >-
      interface PortDefinition { mode?: PortMode; producers?: "single" | "many" }
    purpose: Configure token publication and declare producer cardinality metadata.
    limitation: The runtime does not currently enforce single versus many producers.
  - name: InputPort
    signature: "interface InputPort { token: PortToken; optional?: boolean }"
    purpose: Bind one local node input to a global token.
  - name: OutputPort
    signature: "interface OutputPort { token: PortToken; mode?: PortMode }"
    purpose: Bind one local node output to a global token with an optional mode override.
  - name: NodeOperation
    signature: >-
      type NodeOperation = ComputeNodeOperation | ActionsNodeOperation |
      InvokeNodeOperation | DecisionNodeOperation
    purpose: Select intrinsic computation, closed actions, external invocation, or branching.
    variants:
      - "ComputeNodeOperation { kind: compute; expression: string }"
      - "ActionsNodeOperation { kind: actions; actions: Action[] }"
      - "InvokeNodeOperation { kind: invoke; tool: string; arguments?: Record<string, string> }"
      - "DecisionNodeOperation { kind: decision; cases: DecisionCase[] }"
    behavior:
      - Compute with one declared output maps the expression value to that output.
      - Compute with multiple outputs requires the expression to return an object keyed by local output name.
      - Decision evaluates cases in declaration order and publishes the first matching case.
      - Actions emit state operations, effects, and events; they do not synthesize graph outputs.
      - Invoke suspends its node and resumes it from OrchestratorResult.outputs.
      - An invoke action inside ActionsNodeOperation settles as an ordinary effect; its outputs do not complete the graph node.
    expression_bindings:
      - $inputs is the object of local input names mapped to available token values.
      - $event is the triggering event payload, or an empty object when no event triggered the node.
      - Expressions do not determine dependency topology.
  - name: NodeTrigger
    signature: >-
      type NodeTrigger = { startup: true } | { event: string; node?: string }
    purpose: Admit a node on Kernel start or a matching event.
    behavior: A trigger does not bypass absent required inputs; only optional inputs may be absent.
  - name: GraphMutation
    signature: >-
      type GraphMutation = addNode | removeNode | replaceNode | addPort |
      removePort | updatePort
    purpose: Change topology as one serialized mutation batch, then reindex and reschedule.
    behavior:
      - A successful batch increments topologyVersion once.
      - addNode rejects a duplicate id; replaceNode rejects an unknown id.
      - removeNode and removePort are no-ops when their target is absent.
      - Existing token values and surviving node consumption versions are retained across reindexing.
    limitations:
      - Producer cardinality and references to removed ports are not validated.
      - Removing or replacing a suspended node does not cancel its active host invocation.
      - Topology mutation is not included in checkpoint or restore.
  - name: ExecutionStatus
    signature: >-
      type ExecutionStatus = "quiescent" | "suspended" | "completed" |
      "yielded" | "failed"
    purpose: Report why continuous propagation returned control to the host.
    current_runtime_values:
      - quiescent
      - suspended
      - yielded
    reserved_not_currently_emitted:
      - completed
      - failed
  - name: ExecutionBudget
    signature: >-
      interface ExecutionBudget { maxNodeExecutions?: number; maxPublications?: number }
    purpose: Bound one scheduling turn without making perpetual graphs invalid.
  - name: ExecutionSnapshot
    signature: >-
      interface ExecutionSnapshot { topologyVersion: number; status: ExecutionStatus;
      tokens: Record<PortToken, TokenRuntimeState>;
      nodes: Record<string, GraphNodeRuntimeState>; readyNodes: string[];
      runningInvocations: InvocationId[] }
    purpose: Expose a clone of current topology version, token versions, node state, and invocation ids.
    limitations:
      - It is an observation API, not a restorable execution checkpoint.
      - runningInvocations includes every active Kernel invocation, not only graph invocations.
  - name: TokenRuntimeState
    signature: >-
      interface TokenRuntimeState { status: "absent" | "available"; value?: Json;
      version: number; producedBy?: string }
    purpose: Record the latest token value, monotonic publication version, and producer node.
  - name: GraphNodeStatus
    signature: 'type GraphNodeStatus = "idle" | "ready" | "running" | "suspended" | "failed"'
    purpose: Describe node lifecycle state in GraphNodeRuntimeState.
    current_behavior: >-
      Readiness is computed rather than persisted; snapshots normally expose idle or suspended.
      failed is reserved and is not currently assigned by the scheduler.
  - name: GraphNodeRuntimeState
    signature: >-
      interface GraphNodeRuntimeState { status: GraphNodeStatus;
      consumedVersions: Record<PortToken, number>; invocationId?: InvocationId;
      failure?: Json }
    purpose: Record the token versions consumed by a node and its lifecycle state.
    limitation: invocationId and failure are declared but are not currently populated by ContinuousGraphRuntime.
  - name: TransitionResult
    signature: >-
      interface TransitionResult { previousRevision: number; revision: number;
      status: ExecutionStatus; state: Record<string, Json>; patch: Patch;
      effects: RecordedEffect[]; execution: ExecutionSnapshot }
    purpose: Return authoritative state and execution settlement from one graph transition.
  - name: GraphInspection
    signature: >-
      interface GraphInspection { topologyVersion: number; diagnostics: GraphDiagnostic[] }
    purpose: >-
      Report dormant tokens, unused outputs, and feedback components as diagnostics,
      not graph-invalidity errors.
  - name: GraphDiagnostic
    signature: >-
      interface GraphDiagnostic { kind: "unproduced-token" | "unused-token" |
      "feedback-component"; token?: PortToken; nodes?: string[] }
    purpose: Describe non-fatal topology observations.
  - name: GraphExecutionResult
    signature: >-
      interface GraphExecutionResult { status: ExecutionStatus;
      publications: Record<PortToken, Json>; operations: PatchOp[];
      effects: OrchestratorEffect[]; events: GIKEvent[]; readyNodes: string[];
      nodeExecutions: number; publicationCount: number }
    purpose: Low-level result returned by one ContinuousGraphRuntime scheduling turn.
    category: advanced
    behavior:
      - publications contains the last raw publication per token in the turn.
      - publicationCount counts every accepted publication even when publications overwrites the same token key.
      - stream accumulation is visible in TokenRuntimeState.value, while publications retains the latest raw item.
  - name: GraphNodeExecutionOutcome
    signature: >-
      interface GraphNodeExecutionOutcome { outputs?: Record<string, Json>;
      operations?: PatchOp[]; effects?: OrchestratorEffect[]; events?: GIKEvent[];
      suspended?: boolean }
    purpose: Result returned by a host executor for actions and invoke nodes.
    category: advanced
  - name: OrchestratorResult
    signature: >-
      interface OrchestratorResult { ops?: PatchOp[]; events?: GIKEvent[];
      outputs?: Record<string, Json>; outcome?: string; detail?: Record<string, Json> }
    purpose: Settle external work with state operations, follow-up events, or graph-local outputs.
    behavior:
      - outputs is consumed only for a suspended InvokeNodeOperation.
      - ops and events use the existing Kernel settlement path.
      - outcome and detail are observability metadata.
  - name: InvocationControl
    signature: >-
      interface InvocationControl { readonly id: InvocationId; readonly signal: AbortSignal;
      emitProgress(progress: OrchestratorProgress): Promise<void>;
      emit(result?: OrchestratorResult): Promise<void> }
    purpose: Publish ordered progress and terminal settlement for a controlled invocation.
  - name: ProjectedProgramDefinition
    signature: >-
      interface ProjectedProgramDefinition extends ProgramDefinition { root: DocNode }
    purpose: An executable program with a renderer-neutral projection tree.
  - name: HeadlessProgramDefinition
    signature: >-
      interface HeadlessProgramDefinition extends ProgramDefinition { root?: never }
    purpose: An executable program with no projection tree.
  - name: ExecutableProgramDefinition
    signature: >-
      type ExecutableProgramDefinition = ProjectedProgramDefinition |
      HeadlessProgramDefinition
    purpose: The complete program input accepted by Kernel.
  - name: RuntimeHandler
    signature: "interface RuntimeHandler { id: string; on: Record<string, Action[]> }"
    purpose: Own event handlers independently of a projection node.
  - name: RuntimeReaction
    signature: "interface RuntimeReaction extends Reaction { id: string }"
    purpose: Own a standing reaction independently of a projection node.
  - name: ProjectedVocabularyManifest
    signature: >-
      interface ProjectedVocabularyManifest { version: string; expression?: string;
      namespaces?: string[]; contexts?: string[]; actions?: string[];
      capabilities: Record<string, CapabilityDescriptor>; externals?: ExternalsSpec }
    purpose: Runtime vocabulary including projection capability descriptors.
  - name: CapabilityDescriptor
    signature: >-
      interface CapabilityDescriptor { propsSchema?: object; emits?: string[];
      slots?: string[]; dataProp?: string }
    purpose: Describe a projection capability's props, events, slots, and bound-data prop.
  - name: ProjectionViewImport
    signature: "interface ProjectionViewImport { from: string; use?: string[] }"
    purpose: Bind a vocabulary alias to all or a selected subset of a projection-view provider.
  - name: ExternalsSpec
    signature: >-
      interface ExternalsSpec { projectionViews?: Record<string, ProjectionViewImport>;
      effectHandlers?: string[];
      services?: Record<string, ServiceRequirement | ServiceDeclaration> }
    purpose: Declare host-provided projection, effect, and logical service dependencies.
  - name: ServiceDeclaration
    signature: >-
      interface ServiceDeclaration { kind: string; version: string;
      operations: Record<string, ServiceOperationDeclaration>; config?: Json;
      scope?: ServiceScope }
    purpose: Declare a logical service kind and its operation contracts without physical credentials.
  - name: ServiceOperationDeclaration
    signature: >-
      interface ServiceOperationDeclaration { operation: string; contract: string;
      mode?: "immediate" | "queued"; subject?: ServiceSubject;
      request?: ServiceDataStage; response?: ServiceDataStage;
      settlement: ServiceSettlementStage; failureSettlement?: ServiceSettlementStage;
      onViolation?: GuardrailViolationAction }
    purpose: Declare request, response, settlement, and guardrail behavior for one service operation.
  - name: ServiceRequirement
    signature: >-
      interface ServiceRequirement { version: string; operations: string[]; kind?: string;
      config?: Json; scope?: ServiceScope }
    purpose: Deprecated migration shape for operation-only service requirements.
  - name: ServiceOutputPolicy
    signature: >-
      interface ServiceOutputPolicy { guardrails?: readonly GuardrailRule[];
      onViolation?: GuardrailViolationAction }
    purpose: Declare validation and settlement policy for service output.
  - name: HeadlessVocabularyManifest
    signature: >-
      type HeadlessVocabularyManifest =
      Omit<ProjectedVocabularyManifest, "capabilities"> &
      { capabilities?: never }
    purpose: Runtime vocabulary with no projection capabilities.
  - name: ExecutableVocabularyManifest
    signature: >-
      type ExecutableVocabularyManifest = ProjectedVocabularyManifest |
      HeadlessVocabularyManifest
    purpose: The complete vocabulary input accepted by Kernel.

wire_contracts:
  version: "0.1"
  envelope: "{ gik: typeof GIK_VERSION; type: string; payload: unknown }"
  messages:
    - "VocabularyMessage: vocabulary + ProjectedVocabularyManifest"
    - "ProjectedProgramMessage: program + ProjectedProgramDefinition"
    - "ProgramMessage: program + HeadlessProgramDefinition"
    - "EventMessage: event + GIKEvent"
    - "PatchMessage: patch + Patch"
    - "ProgressMessage: progress + InvocationProgress"
    - "TraceMessage: trace + TraceEvent"
  union: >-
    GIKMessage = VocabularyMessage | ProjectedProgramMessage | ProgramMessage |
    EventMessage | PatchMessage | ProgressMessage | TraceMessage
  compatibility: No manifest or document type aliases are accepted.

internal_subsystems:
  execution:
    owns:
      - event and action reduction
      - machines
      - standing derivations and reactions
      - effects, checkpoints, restore, and revisioning
    accepts: ExecutableProgramDefinition
    modules:
      - kernel/src/reduce.ts
      - kernel/src/derivations.ts
      - kernel/src/kernel.ts
  graph_execution:
    owns:
      - explicit port-token topology and token versions
      - deterministic readiness and propagation to quiescence
      - valid feedback cycles, dormant paths, suspension, and budget yielding
      - serialized topology mutation, reindexing, and rescheduling
    accepts: ProgramGraph
    modules:
      - kernel/src/graph-runtime.ts
      - kernel/src/kernel.ts
  projection:
    owns:
      - DocNode interpretation
      - ResolvedNode production
      - renderer transport onboarding
    requires: ProjectedProgramDefinition
    modules:
      - kernel/src/interpret.ts
      - kernel/src/client.ts
      - kernel/src/transport.ts

classes:
  - name: Kernel
    category: primary
    purpose: Own one authoritative, revisioned execution of a GIK program.
    source: kernel/src/kernel.ts
    constructor:
      signature: >-
        new Kernel(manifest: Enveloped<ExecutableVocabularyManifest>,
        document: Enveloped<ExecutableProgramDefinition>, opts?: KernelOptions)
      behavior:
        - Validates the program and capability references unless disabled.
        - Installs host-supplied providers or package defaults.
        - Does not initialize machines until init or baseline is called.
    methods:
      - name: init
        signature: "init(): Patch"
        category: primary
        purpose: Seed machine states and return only their revision-zero set operations.
        mutates_state: true
        increments_revision: false
      - name: start
        signature: "start(budget?: ExecutionBudget): Promise<TransitionResult>"
        category: primary
        purpose: Seed graph inputs from current state, fire startup nodes, and propagate.
        behavior:
          - Flattens object-valued state into dotted leaf tokens before startup triggers run.
          - Uses value-mode equality to avoid retriggering unchanged leaves.
        mutates_state: conditional
        increments_revision: only-when-work-settles
      - name: publish
        signature: >-
          publish(values: Record<PortToken, Json>, budget?: ExecutionBudget):
          Promise<TransitionResult>
        category: primary
        purpose: Publish external token values and propagate reachable nodes.
        behavior:
          - Accepts any token name; ProgramGraph.inputs is not an access-control list.
          - Commits changed input and output publications as state paths.
        mutates_state: conditional
        increments_revision: only-when-work-settles
      - name: mutate
        signature: >-
          mutate(mutations: readonly GraphMutation[], budget?: ExecutionBudget):
          Promise<TransitionResult>
        category: primary
        purpose: Apply one serialized topology batch, advance its version, reindex, and resume.
        mutates_state: conditional
        increments_revision: only-when-work-settles
      - name: resume
        signature: "resume(budget?: ExecutionBudget): Promise<TransitionResult>"
        category: primary
        purpose: Continue ready graph work after yielding or host-controlled suspension.
        mutates_state: conditional
        increments_revision: only-when-work-settles
      - name: execution
        signature: "execution(): ExecutionSnapshot"
        category: primary
        purpose: Return current topology, token versions, node states, and invocations.
        mutates_state: false
      - name: dispatch
        signature: "dispatch(event: GIKEvent): Promise<Patch>"
        category: primary
        purpose: Apply one event to the authoritative runtime.
        behavior:
          - Serializes mutations.
          - Settles actions, immediate effects, standing derivations, and reactions.
          - Publishes current state leaves into the graph before running graph event triggers.
          - Commits and publishes one initiating patch.
          - Starts asynchronous invokes after the initiating patch commits.
        mutates_state: true
        increments_revision: true
      - name: syncExternal
        signature: "syncExternal(): Promise<Patch>"
        category: primary
        purpose: Settle derivations and reactions after shared state changed outside this Kernel.
        mutates_state: conditional
        increments_revision: only-when-work-settles
      - name: resolve
        signature: "resolve(): Promise<ResolvedNode>"
        category: primary
        purpose: Resolve a projected program into a renderer-neutral tree.
        throws: ProjectionUnavailableError when the runtime has no projection root.
        mutates_state: false
      - name: hasProjection
        signature: "hasProjection(): boolean"
        category: primary
        purpose: Report whether resolve is available for this runtime.
      - name: state
        signature: "state(): Record<string, Json>"
        category: primary
        purpose: Return the current state snapshot.
        mutates_state: false
      - name: subscribePatches
        signature: "subscribePatches(listener: (patch: Patch) => unknown): () => void"
        category: primary
        purpose: Subscribe to committed patches and receive an unsubscribe function.
      - name: subscribeProgress
        signature: "subscribeProgress(listener: (progress: InvocationProgress) => unknown): () => void"
        category: primary
        purpose: Subscribe to asynchronous invocation progress.
      - name: cancelInvocation
        signature: "cancelInvocation(id: InvocationId): void"
        category: primary
        purpose: Abort and close an active invocation; unknown IDs are ignored.
      - name: whenIdle
        signature: "whenIdle(): Promise<void>"
        category: primary
        purpose: Wait for queued mutations and invocations, then surface invocation failures.
      - name: dispose
        signature: "dispose(): void"
        category: primary
        purpose: Cancel active invocations and remove runtime listeners.
      - name: checkpoint
        signature: "checkpoint(): Checkpoint"
        category: primary
        purpose: Capture an immutable revision-keyed snapshot of StateModel state only.
        excludes:
          - graph topology and topologyVersion
          - token values and consumed versions
          - suspended nodes and active invocations
        mutates_state: false
      - name: restore
        signature: "restore(checkpoint: Checkpoint): Promise<Patch>"
        category: primary
        purpose: Restore pure state as a new revision and settle derivations.
        guarantees:
          - Does not claim to undo external effects.
          - Publishes the resulting patch.
        limitations:
          - Does not restore or reset graph topology, tokens, node versions, or invocations.
          - Does not automatically republish restored state into graph tokens.
        mutates_state: true
        increments_revision: true
      - name: effectsSince
        signature: "effectsSince(revision: number): RecordedEffect[]"
        category: primary
        purpose: Return external effects after a revision in causal order.
        mutates_state: false
      - name: compensate
        signature: "compensate(effects: OrchestratorEffect[]): Promise<Patch>"
        category: primary
        purpose: Ask the host to compensate effects in caller-supplied order.
        mutates_state: conditional
        increments_revision: true
      - name: baseline
        signature: "baseline(): Patch"
        category: advanced
        purpose: Initialize machines and return the complete current state for initial client onboarding.
      - name: snapshotPatch
        signature: "snapshotPatch(): Patch"
        category: advanced
        purpose: Return all state at the current revision without reinitializing machines.

  - name: GIKClient
    category: primary
    purpose: Maintain a renderer-side replica over a TransportProvider.
    source: kernel/src/client.ts
    constructor:
      signature: "new GIKClient(transport: TransportProvider, options?: GIKClientOptions)"
    methods:
      - name: start
        signature: "start(): void"
        purpose: Subscribe to the transport.
      - name: stop
        signature: "stop(): void"
        purpose: Detach from the transport.
      - name: rebind
        signature: "rebind(transport: TransportProvider): void"
        purpose: Reconnect while retaining replica state and revision.
      - name: getTree
        signature: "getTree(): ResolvedNode | null"
        purpose: Return the latest resolved tree, or null before onboarding.
        headless_program_behavior: Remains null when a headless program is received.
      - name: getRev
        signature: "getRev(): number"
        purpose: Return the last applied revision, or -1 before onboarding.
      - name: get
        signature: "get(path: string): Json | undefined"
        purpose: Read a path from the local replica.
      - name: subscribe
        signature: "subscribe(listener: () => void): () => void"
        purpose: Subscribe to resolved-tree changes.
      - name: subscribeProgress
        signature: "subscribeProgress(listener: (progress: InvocationProgress) => void): () => void"
        purpose: Subscribe to invocation progress.
      - name: emit
        signature: >-
          emit(node: string, name: string, payload?: Record<string, Json>,
          actorId?: string): void | Promise<void>
        purpose: Send an event to the authoritative runtime.

  - name: KernelTransportHost
    category: advanced
    purpose: Bind one Kernel to one or more transport-neutral connections.
    source: kernel/src/transport.ts
    constructor:
      signature: >-
        new KernelTransportHost(manifest: Enveloped<ProjectedVocabularyManifest>,
        document: Enveloped<ProjectedProgramDefinition>, kernel: Kernel,
        defaultTransport?: TransportProvider)
    methods:
      - name: start
        signature: "start(): Promise<void>"
        purpose: Attach the optional default transport.
      - name: attach
        signature: "attach(transport: TransportProvider, fromRevision?: number): Promise<() => void>"
        purpose: Attach and onboard or resume one connection.
        throws: ProjectionUnavailableError if the supplied program has no projection root.
      - name: detach
        signature: "detach(transport: TransportProvider): void"
        purpose: Detach one connection.
      - name: stop
        signature: "stop(): void"
        purpose: Detach all connections.
      - name: dispatch
        signature: "dispatch(event: GIKEvent): Promise<Patch>"
        purpose: Serialize an in-process event and broadcast its patch.
      - name: whenIdle
        signature: "whenIdle(): Promise<void>"
        purpose: Wait for dispatch, invocation, and outbound delivery queues.

  - name: ContinuousGraphRuntime
    category: advanced
    purpose: Execute an explicit port-token graph without Kernel state, revision, or transport ownership.
    source: kernel/src/graph-runtime.ts
    constructor:
      signature: >-
        new ContinuousGraphRuntime(graph: ProgramGraph, expression: ExpressionProvider,
        executeNode?: GraphNodeExecutor)
    methods:
      - "publish(values: Record<PortToken, Json>, budget?: ExecutionBudget): Promise<GraphExecutionResult>"
      - "start(budget?: ExecutionBudget): Promise<GraphExecutionResult>"
      - "dispatch(event: GIKEvent, budget?: ExecutionBudget): Promise<GraphExecutionResult>"
      - "resume(budget?: ExecutionBudget): Promise<GraphExecutionResult>"
      - "complete(nodeId: string, outputs: Record<string, Json>, budget?: ExecutionBudget): Promise<GraphExecutionResult>"
      - "mutate(mutations: readonly GraphMutation[]): void"
      - "inspect(): GraphInspection"
      - "status(): ExecutionStatus"
      - "readyNodeIds(): string[]"
      - "snapshotTokens(): Record<PortToken, TokenRuntimeState>"
      - "snapshotNodes(): Record<string, GraphNodeRuntimeState>"
    boundary: >-
      Kernel is the primary API. Direct users must commit operations/effects/events themselves
      and provide an executor for actions or invoke nodes.

host_extension_interfaces:
  - name: ExpressionProvider
    purpose: Evaluate the expression language selected by the host.
    methods:
      - "eval(expression: string, data: unknown, bindings?: Record<string, unknown>): Json | Promise<Json>"
  - name: StateModel
    purpose: Store JSON state without changing Kernel reduction semantics.
    methods:
      - "snapshot(): Record<string, Json>"
      - "get(path: string): Json"
      - "apply(operations: PatchOp[]): void"
  - name: CapabilityRegistry
    purpose: Resolve capabilities declared by a vocabulary.
    methods:
      - "has(type: string): boolean"
      - "get(type: string): CapabilityDescriptor | undefined"
  - name: Orchestrator
    purpose: Execute host-owned time, effects, human input, and routing.
    methods:
      - "invoke?(effect: OrchestratorEffect, control: InvocationControl): Promise<OrchestratorResult | void>"
      - "confirm?(effect: OrchestratorEffect): Promise<OrchestratorResult | void>"
      - "route?(effect: OrchestratorEffect): Promise<OrchestratorResult | void>"
      - "compensate?(effect: OrchestratorEffect): Promise<OrchestratorResult | void>"
    invocation_settlement:
      - InvocationControl.emitProgress publishes non-terminal progress.
      - InvocationControl.emit settles once; later emissions reject with InvocationClosedError.
      - OrchestratorResult.outputs maps local names to a suspended graph invoke node's declared outputs.
      - Unknown local output names fail settlement rather than creating undeclared tokens.
  - name: GraphNodeExecutor
    purpose: Execute low-level actions or invoke nodes for ContinuousGraphRuntime.
    methods:
      - >-
        (node: ProgramNode, inputs: Record<string, Json>, event?: GIKEvent):
        Promise<GraphNodeExecutionOutcome>
  - name: TransportProvider
    purpose: Carry GIK messages without owning runtime semantics.
    methods:
      - "send(message: GIKMessage): void | Promise<void>"
      - "subscribe(listener: TransportListener): () => void"
  - name: TransportBroker
    purpose: Accept renderer transport connections.
    methods:
      - "attach(transport: TransportProvider, fromRevision?: number): Promise<() => void>"

provided_implementations:
  - "JsonataExpressionProvider implements ExpressionProvider"
  - "SyncJsonataExpressionProvider implements ExpressionProvider"
  - "InMemoryStateModel implements StateModel"
  - "CompositeStateModel implements StateModel"
  - "VocabularyRegistry implements CapabilityRegistry"
  - "NullOrchestrator implements Orchestrator"

free_functions:
  - group: action-authoring
    category: primary
    functions:
      - "assign(target: string, value: Json): Action"
      - "assignFrom(target: string, expression: string): Action"
      - "derive(target: string, expression: string): Action"
      - "emit(event: string, payload?: Record<string, Json>): Action"
      - "invoke(tool: string, arguments?: Record<string, Json>): Action"
      - "route(destination: Json, arguments?: Record<string, Json>): Action"
      - "confirm(arguments?: Record<string, Json>): Action"
      - "guarded(action: Action, guard: string): Action"
      - "reaction(when: string, actions: Action[], options?: { runInitially?: boolean }): Reaction"
  - group: program-authoring
    category: primary
    functions:
      - "node(capability: string, id: string, options?: NodeOptions): DocNode"
      - "projectedProgram(root: DocNode, options?: ProgramOptions): ProjectedProgramDefinition"
      - "authorProjectedProgram(root: DocNode, options?: ProgramOptions): ProjectedProgramMessage"
      - "program(options: HeadlessProgramOptions): HeadlessProgramDefinition"
      - "authorProgram(options: HeadlessProgramOptions): ProgramMessage"
      - "generateVocabulary(program: ExecutableProgramDefinition, options?: GenerateVocabularyOptions): ProjectedVocabularyManifest"
      - "lintVocabularyReferences(vocabulary: ProjectedVocabularyManifest, program: ExecutableProgramDefinition): LintWarning[]"
  - group: validation
    category: primary
    functions:
      - "validateProgramMessage(message: unknown): void"
      - "validateProgramDefinition(program: ExecutableProgramDefinition, capabilities?): void"
      - "validateJsonataExpression(expression, options?): JsonataExpressionValidationResult"
  - group: lowering
    category: advanced
    functions:
      - "pipeline<In, Out>(first: Stage<In, Out>): Pipeline<In, Out>"
      - >-
        lowerToProgram<In, Out extends ExecutableProgramDefinition>(
        lowering: ProgramLowering<In, Out>, input: In): ProgramMessageFor<Out>
      - >-
        lowerToProjectedProgram<In>(
        lowering: ProgramLowering<In, ProjectedProgramDefinition>,
        input: In): ProjectedProgramMessage
  - group: protocol
    category: primary
    functions:
      - "envelope(type, payload): GIKMessage"
      - "unwrap<T>(message: Enveloped<T>): T"
  - group: transport
    category: advanced
    functions:
      - "createInMemoryTransportPair(): [TransportProvider, TransportProvider]"
  - group: confirmation
    category: advanced
    functions:
      - "confirmPrompt(effect: OrchestratorEffect): ConfirmPrompt"
      - "confirmOutcomeEvent(outcome, ...): GIKEvent"
  - group: observability
    category: advanced
    functions:
      - "formatTrace(trace: TraceEvent): string"
      - "consoleSink(output?): TraceSink"
      - "bufferSink(): { sink: TraceSink; events: TraceEvent[] }"
      - "multiSink(...sinks: TraceSink[]): TraceSink"

internal_candidate_exports:
  reason: >-
    These modules expose execution mechanics that should not become durable accidentally.
  modules:
    - kernel/src/interpret.ts
    - kernel/src/reduce.ts
    - kernel/src/derivations.ts
  notes:
    - StateModel, InMemoryStateModel, CompositeStateModel, and DerivationScheduler remain exported migration surfaces.
    - Legacy handlers, reactions, machines, and derivations may coexist with ProgramGraph in one program.

behavioral_guarantees:
  - Authoritative mutations are serialized and revisions increase monotonically.
  - Pure state changes are represented as Patch operations.
  - External work is delegated through Orchestrator and recorded separately from pure state.
  - Restore never claims to undo an external effect.
  - Transport and in-process consumers observe the same event, patch, and revision model.
  - Headless programs execute without fabricated projection nodes or capabilities.
  - Projection is optional for execution and explicit at resolve and renderer boundaries.
  - Renderer transport attachment requires a ProjectedProgramDefinition.
  - Cycles, self-feedback, disconnected components, and unproduced tokens are valid graph topology.
  - Graph propagation stops at quiescence, suspension, or an execution-budget yield.
  - Graph dependencies come only from declared input and output tokens, never expression inference.
  - Wire message kinds are vocabulary, program, event, patch, progress, and trace.
  - No manifest or document message aliases are accepted.

current_graph_limitations:
  - ExecutionStatus.completed and ExecutionStatus.failed are reserved but not emitted.
  - GraphNodeStatus.ready and GraphNodeStatus.failed are declared but not persisted by the scheduler.
  - PortDefinition.producers is metadata only and is not enforced.
  - stream mode exposes an accumulated JSON array, not a consumable per-subscriber queue.
  - Kernel patches store the latest raw stream publication; ExecutionSnapshot.tokens stores the accumulated stream array.
  - Mutation does not reconcile or cancel active invocations for removed or replaced nodes.
  - Cancelling, failing, or leaving a graph invoke unhandled does not currently release its suspended node.
  - A mutation rejected during reindexing is not transactionally rolled back.
  - Checkpoint and restore cover StateModel state, not graph execution state.
  - syncExternal settles legacy derivations and reactions but does not publish shared state into graph tokens.
  - Follow-up events returned by OrchestratorResult settle legacy handlers and reactions but do not currently enter graph event triggers.

verification:
  commands:
    - npm run test:kernel
    - npm run conformance
    - npm run test:jsonata
    - npm run build --workspace=@gik/kernel

open_decisions:
  - Which advanced and internal-candidate exports remain public for version 1?
  - Should program authoring and lowering functions move to a separate package?
  - When does measured deployment or versioning pressure justify splitting execution and projection packages?