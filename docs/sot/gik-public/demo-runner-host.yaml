schema_version: 1

package:
  name: "@gik/demo-runner-host"
  version: "0.1.5"
  purpose: >-
    Add validated demo scenarios, playback controls, human-gate coordination, inspection,
    and presentation selection around an injected Blueprint-compatible React host.
  core_promise: >-
    GikDemoBlueprintHost prepares demo behavior and passes the resulting companions,
    contexts, bridge, and host inputs to a caller-supplied HostComponent.
  public_entrypoint: packages/demo-runner-host/src/index.ts
  implementation_entrypoint: packages/demo-runner-host/src/GikDemoBlueprintHost.tsx

api_policy:
  signature_authority: generated TypeScript declarations
  categories:
    host: React host composition API.
    scenario: Demo artifact, catalog, validation, and selection API.
    control: Request dispatch and receipt contracts.
    inspection: Timeline, focus, participant, and inspection data contracts.
    presentation: Presentation preset resolution and default context.

architecture:
  owns:
    - Demo scenario and catalog contracts.
    - Demo schema and cross-contract validation.
    - Scenario selection and playback coordination.
    - Control request, receipt, human-gate, focus, timeline, and inspection contracts.
    - Assembling internal demo-runner and control-harness companion bundles as program+vocabulary bundles.
    - Presentation-preset resolution for demos.
    - Applying a selected presentation preset's state fragment to the live shared contexts without reopening the target.
  injected_boundary:
    - The caller supplies HostComponent.
    - HostComponent must accept DemoTargetHostProps.
    - The package passes the target Blueprint, companions, contexts, bridge, and host options to HostComponent.
  does_not_own:
    - The concrete Blueprint host implementation.
    - Blueprint program preparation semantics; control-routing inspection delegates to @gik/blueprint.
    - Kernel execution semantics.
    - Application ownership of navigation after writeDemoNavigation returns a URL string.
    - ServiceHost construction, service-kind admission, credentials, endpoint policy, or service fixtures.
  dependency_direction:
    - "@gik/demo-runner-host -> @gik/blueprint"
    - "@gik/demo-runner-host -> @gik/evaluators"
    - "@gik/demo-runner-host -> @gik/kernel"
    - "@gik/demo-runner-host -> @gik/react"
    - "@gik/react does not depend on @gik/demo-runner-host"

host_component_contract:
  name: DemoTargetHostProps
  signature: >-
    interface DemoTargetHostProps { blueprint: BlueprintArtifact;
    resolveLeavesProvider?: ProviderResolver; native?: BundleNative;
    companions?: CompositionOrganism[]; contexts?: BundleContextBindings;
    fileServices?: GenUIFileServices; primaryBridge?: OrganismBridge;
    primaryInstanceId?: string | number; className?: string;
    style?: React.CSSProperties; context?: Record<string, Json> }
  rule: Any structurally compatible React component may be supplied as HostComponent.
  service_rule: >-
    External-service execution and deterministic service doubles are composed by the outer host
    through native.wrapOrchestrator. GikDemoBlueprintHost forwards native unchanged and does not
    depend on a concrete Blueprint host or own service policy.

intended_composition:
  owner: Application host or an application-owned composition component.
  assembly:
    - The composition owner imports GikDemoBlueprintHost and its chosen target host independently.
    - For the standard Blueprint path, the composition owner supplies BlueprintHost as HostComponent.
    - The composition owner supplies the BlueprintHost-compatible target props directly on GikDemoBlueprintHost, together with demo-specific props such as scenariosJson.
    - GikDemoBlueprintHost treats the target props as the structural DemoTargetHostProps contract; it does not import, construct, or receive a nested BlueprintHostProps object.
    - Without an active demo, GikDemoBlueprintHost invokes HostComponent with the unchanged target-host values.
    - With an active demo, GikDemoBlueprintHost explicitly merges or replaces only demo-owned values such as companions, contexts, primaryBridge, primaryInstanceId, context, and composition style before invoking HostComponent.
    - The target host then owns its normal lifecycle. BlueprintHost opens and mounts the supplied Blueprint exactly as it would without the demo wrapper.
  canonical_shape: >-
    <GikDemoBlueprintHost HostComponent={BlueprintHost} blueprint={blueprint}
    native={native} resolveLeavesProvider={resolveLeavesProvider}
    scenariosJson={scenariosJson} />
  rules:
    - GikDemoBlueprintHost remains generic over any React component structurally compatible with DemoTargetHostProps.
    - Demo-specific props are consumed by GikDemoBlueprintHost and are not blindly spread into HostComponent.
    - BlueprintHost and BlueprintHostProps are not imported by @gik/demo-runner-host.
    - The application composition layer may create a local wrapper for repeated setup, but that wrapper does not become a platform package dependency.

component:
  name: GikDemoBlueprintHost
  signature: "function GikDemoBlueprintHost(props: GikDemoBlueprintHostProps): React.ReactElement"
  props_signature: >-
    interface GikDemoBlueprintHostProps extends Omit<DemoTargetHostProps, "primaryBridge"> {
    HostComponent: React.ComponentType<DemoTargetHostProps>;
    scenariosJson?: DemoScenariosJson;
    showControlHarness?: boolean; presentationContext?: string | null;
    onPresentationPresetChange?: (presetId: string) => void }
  common_behavior:
    - Loads and validates scenariosJson whenever it is supplied, whether or not a demo query is present.
    - Reads browser query parameters once per component mount and does not subscribe to URL changes.
  behavior_without_active_tooling:
    - Renders HostComponent with the supplied target-host props.
    - Does not add demo companions, contexts, or a primary bridge.
  behavior_with_inspector_only:
    - Activates when the gik query is present with any value other than the exact string 0, or when showControlHarness is true.
    - Materializes declared target contexts and a generic control context, then mounts only the inspector Bundle under GikToolingShell.
    - Does not create demo state, install a scenario bridge, or require scenariosJson.
  behavior_with_active_demo:
    - Activates demo mode when scenariosJson is supplied and the demo query parameter is present with an empty value or any value other than the exact string 0.
    - Starts with catalog index 0 among entries compatible with the target Blueprint.
    - Owns later scenario selection as internal component state and does not navigate or rewrite the demo query parameter.
    - Rebuilds the selected scenario plan, entry, presets, contexts, and runner bundle, and gives the runner and target scenario-specific mounted identities.
    - Reads presentation context from the prop, then the presentation or presentationContext query aliases in that order.
    - Filters available presentation presets to ScenarioPlan.applicableContexts, then resolves the requested preset, entry default, full-substrate preset, or first filtered preset.
    - Seeds control.presentationPresetId and control.presentationContext from the resolved preset and passes the filtered presets to the demo-runner presentation control.
    - Subscribes to control.presentationPresetId and, whenever it changes, deep-merges the matching preset's context fragment into the live shared contexts as leaf-level set operations that preserve sibling keys, then calls onPresentationPresetChange.
    - Applies a presentation-preset change in place without reopening or remounting the target, so in-progress target state is preserved across presentation changes.
    - Starts scenario playback at act index 0.
    - Creates demo-owned control and demo SharedContextStore instances.
    - Materializes target context namespaces generically from the Blueprint runtime declaration and initial state; no domain namespace is known by the host.
    - Activates the scenario runner from the demo query and the inspector independently from the gik query or showControlHarness prop.
    - Wraps active tooling surfaces in GikToolingShell, which coordinates visibility and non-overlapping placement while preserving separate runner and inspector Bundles.
    - Keeps scenario state under demo, target command requests and receipts under control, inspector-local UI state under inspector, and target inspection data under control.inspection.
    - Adds the demo-runner companion and adds the inspector companion only when inspector tooling is active.
    - Installs a primary bridge that coordinates control requests and human gates.
    - Passes the prepared companions, contexts, bridge, and context to HostComponent.
    - Forwards the caller's primaryInstanceId unchanged without an active demo.
    - Preserves the caller's primaryInstanceId as the base identity and adds the selected scenario id and reset epoch so a compatible HostComponent can give the target a fresh mounted identity.
  built_in_commands:
    - name: "$apply-state"
      behavior: Applies path-value operations to the demo seed without dispatching to the target controller.
    - name: "$reset-state"
      behavior: Restores the base demo seed without dispatching to the target controller.

scenario_contracts:
  - name: ScenarioBlueprintArtifact
    signature: >-
      interface ScenarioBlueprintArtifact { gik: string; type: "scenario-blueprint";
      payload: ScenarioPlan }
  - name: ScenarioPlan
    signature: >-
      interface ScenarioPlan { id: string; targetBlueprintId: string; title: string;
      applicableContexts: string[]; pace: { manualDurationMs: number;
      autoDurationMs: number; default: "manual" | "auto" }; steps: ScenarioStep[] }
  - name: ScenarioStep
    signature: >-
      interface ScenarioStep { id: string; title: string;
      kind: "dispatch" | "human-gate"; command?: string; commands?: string[];
      payload?: Record<string, Json>; actorRef?: FocusRef; waitAfterMs?: number;
      humanBoundary?: FocusRef; focusRefs?: FocusRef[] }
  - name: DemoScenariosJson
    signature: "interface DemoScenariosJson { catalog: DemoCatalog; scenarios: ScenarioBlueprintArtifact[] }"
  - name: DemoCatalog
    signature: >-
      interface DemoCatalog { default: string; targets: Record<string, DemoTargetCatalogEntry>;
      entries: DemoCatalogEntry[] }
  - name: PresentationPreset
    signature: >-
      interface PresentationPreset { id: string; label?: string; audience?: string;
      focus?: string; context: Record<string, Json> }
    notes: >-
      context is a namespace-keyed state fragment (for example { soc: { presentation: … } }).
      GikDemoBlueprintHost merges it into the live shared context whose top-level key matches a
      namespace; fragment namespaces with no matching live store are ignored.

scenario_api:
  - name: compileScenarioBlueprint
    behavior:
      - Requires scenario identity, target identity, applicable contexts, and at least one step.
      - Rejects duplicate step and context ids.
      - Enforces dispatch and human-gate command shapes.
      - Returns a structured clone of the plan.
  - name: validateDemoCatalog
    behavior: Validates targets, entries, scenario references, target compatibility, and the default entry.
  - name: validateDemoComposition
    behavior:
      - Validates one selected scenario against target commands, gates, actors, contexts, focus kinds, and timeline sources.
      - Rejects built-in demo commands in human-gate steps.
  - name: validateDemoTargetBundleContract
    behavior: Validates command node/event references against a projected Kernel vocabulary and program.
  - name: loadDemoScenarios
    behavior:
      - Validates the full input against schemas/demo-scenarios.schema.json.
      - Compiles scenarios and validates the catalog.
      - Returns the catalog and a composition resolver.
  - name: resolveDemoEntry
    behavior: Selects an exact id, requested index, numeric id, target-first entry, or catalog default in that order where applicable.
  - name: scenarioStepCommands
    behavior: Returns the non-empty commands represented by one step.
  - name: writeDemoNavigation
    behavior: Returns a URL string whose demo query parameter is the selected entry id.

control_api:
  contracts:
    - ControlCommandDescriptor
    - OrganismControlContract
    - ControlRequest
    - ControlReceipt
    - ControlRuntime
  function:
    name: createHeadlessControlRuntime
    behavior:
      - Rejects incompatible Blueprint ids, unsupported commands, and human-gated commands.
      - Writes the request to control.request before emitting the mapped node event.
      - Returns a matching runtime receipt when present, otherwise a completed receipt.
      - Converts thrown dispatch errors into failed receipts.
      - Exposes a state snapshot.

focus_and_inspection_api:
  focus_contracts:
    - FocusKind
    - FocusRef
    - FocusTarget
    - TimelineItem
    - ControlSelection
  aliases:
    DemoSelection: Public type alias for ControlSelection.
  focus_functions:
    - selectionFromTimelineItem
    - focusRefMatches
    - selectionContainsFocus
    - resolveFocusTargets
  inspection_contracts:
    - InspectionParticipant
    - InspectionPresentation
    - InspectionPresentationContext
    - BlueprintInspection
    - BlueprintInspectionField
    - BlueprintInspectionStage
    - InspectionStatus
    - OrganismInspection
    - ParticipantKind
    - ParticipantSetting
    - ParticipantStatus
    - ParticipantToggleSetting

presentation_api:
  default_context: full-substrate
  function:
    name: resolvePresentationContext
    behavior: Selects the requested preset, preferred default, full-substrate preset, or first available preset in that order from the supplied preset list.

public_exports:
  host:
    - GikDemoBlueprintHost
    - GikDemoBlueprintHostProps
    - DemoTargetHostProps
    - DemoComposition
  scenario:
    - ScenarioBlueprintArtifact
    - ScenarioPlan
    - ScenarioStep
    - DemoCatalog
    - DemoCatalogEntry
    - DemoScenariosJson
    - DemoTargetCatalogEntry
    - LoadedDemoScenarios
    - OrganismDemoContract
    - PresentationPreset
    - GIK_DEMO_APPLY_STATE_COMMAND
    - GIK_DEMO_RESET_STATE_COMMAND
    - compileScenarioBlueprint
    - isBuiltInDemoCommand
    - loadDemoScenarios
    - resolveDemoEntry
    - scenarioStepCommands
    - validateDemoCatalog
    - validateDemoComposition
    - validateDemoTargetBundleContract
    - writeDemoNavigation
  control:
    - ControlCommandDescriptor
    - ControlReceipt
    - ControlRequest
    - ControlRuntime
    - OrganismControlContract
    - createHeadlessControlRuntime
  focus_and_inspection:
    - BlueprintInspection
    - BlueprintInspectionField
    - BlueprintInspectionStage
    - ControlSelection
    - DemoSelection
    - FocusKind
    - FocusRef
    - FocusTarget
    - InspectionParticipant
    - InspectionPresentation
    - InspectionPresentationContext
    - InspectionStatus
    - OrganismInspection
    - ParticipantKind
    - ParticipantSetting
    - ParticipantStatus
    - ParticipantToggleSetting
    - TimelineItem
    - focusRefMatches
    - resolveFocusTargets
    - selectionContainsFocus
    - selectionFromTimelineItem
  presentation:
    - DEFAULT_PRESENTATION_CONTEXT
    - resolvePresentationContext
