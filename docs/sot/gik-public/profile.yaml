schema_version: 1

package:
  name: "@gik/profile"
  version: "0.1.1"
  status: transitional
  purpose: >-
    Expose canonical Blueprint and Cell authoring functions while temporarily
    retaining legacy Profile pipeline and GenUI lowering functions.
  public_entrypoint: packages/profile/src/index.ts
  implementation_entrypoint: profile/src/index.ts

api_policy:
  signature_authority: generated TypeScript declarations
  categories:
    canonical: Intended Blueprint and Cell public API.
    bridge: Needed while Blueprint execution still lowers through Profile or ProjectedProgramDefinition.
    legacy_transitional: Existing Profile and GenUI API scheduled for redesign or removal.
    internal_candidate: Exported today but not yet accepted as a durable contract.

free_functions:
  - group: blueprint-lifecycle
    category: canonical
    source: profile/src/blueprint.ts
    functions:
      - name: createBlueprint
        signature: >-
          createBlueprint<TRecipe extends RecipeBase = RecipeBase>(
          payload: BlueprintArtifact<TRecipe>["payload"]): BlueprintArtifact<TRecipe>
        purpose: Clone and validate a Blueprint payload into an enveloped artifact.
        guarantees:
          - Does not retain the caller's mutable payload object.
          - Returns only a structurally and semantically valid artifact.
      - name: parseBlueprintJson
        signature: >-
          parseBlueprintJson<TRecipe extends RecipeBase = RecipeBase>(
          text: string): BlueprintArtifact<TRecipe>
        purpose: Parse JSON text and validate the resulting Blueprint artifact.
      - name: stringifyBlueprint
        signature: >-
          stringifyBlueprint<TRecipe extends RecipeBase = RecipeBase>(
          blueprint: BlueprintArtifact<TRecipe>): string
        purpose: Validate and serialize a Blueprint as formatted JSON.
      - name: assembleBlueprint
        signature: >-
          assembleBlueprint<TRecipe extends RecipeBase = RecipeBase>(
          source: BlueprintArtifact<TRecipe>,
          resolveReference?: BlueprintReferenceResolver<TRecipe>): BlueprintArtifact<TRecipe>
        purpose: Resolve all child Blueprint references into one self-contained artifact.
        guarantees:
          - Recursively validates source, children, and final artifact.
          - Replaces every child $ref with an inline Blueprint.
          - Rejects unresolved references and recursive Blueprint ID cycles.
          - Does not mutate the source artifact.
      - name: loadBlueprint
        signature: >-
          loadBlueprint<TRecipe extends RecipeBase = RecipeBase>(value: unknown,
          resolve?: ResourceResolver,
          resolveTemplate?: ProfileTemplateResolver): ResolvedProfile<TRecipe>
        category: bridge
        purpose: Validate a Blueprint and lower it into the current ResolvedProfile execution bridge.
        migration_direction: Replace with a Blueprint-native execution or projection API.

  - group: blueprint-validation
    category: canonical
    source: profile/src/schema.ts
    functions:
      - name: validateBlueprintArtifact
        signature: >-
          validateBlueprintArtifact<TRecipe extends RecipeBase = RecipeBase>(
          artifact: unknown): asserts artifact is BlueprintArtifact<TRecipe>
        purpose: Enforce Blueprint JSON Schema and current semantic reference rules.
        throws: BlueprintValidationError

  - group: cell-composition
    category: canonical
    source: profile/src/cells.ts
    functions:
      - name: tokenPattern
        signature: "tokenPattern(source: string): TokenPattern"
        purpose: Compile one parameterized Cell token pattern and reject invalid parameters.
      - name: analyzeCellComposition
        signature: "analyzeCellComposition(cells: readonly CellDefinition[]): CellComposition"
        purpose: Report providers, external inputs, and deterministic composition diagnostics.
        mutates_input: false
      - name: compileCellTopology
        signature: >-
          compileCellTopology(id: string,
          definition: CellProjectionDefinition): ExecutableCellTopology
        purpose: Compile Cell input/output declarations into an executable dataflow topology.
        note: A topology is one relationship projection, not intrinsic Blueprint structure.
      - name: composeCellDocument
        signature: >-
          composeCellDocument(definition: CellProjectionDefinition,
          topology: ExecutableCellTopology): ProjectedProgramDefinition
        category: bridge
        purpose: Compile the current presentation projection and Cell computations into a projected program definition.
        guarantees:
          - Rejects topology diagnostics.
          - Requires exactly one presentation root.
          - Rejects unknown, non-visual, or cyclic presentation Cells.
          - Lowers Cell computations into standing kernel derivations.

  - group: profile-loading
    category: legacy_transitional
    source:
      - profile/src/schema.ts
      - profile/src/profile-core.ts
    functions:
      - name: validateProfileArtifact
        signature: "validateProfileArtifact(artifact: unknown): asserts artifact is ProfileArtifact"
        throws: ProfileValidationError
      - name: validateLoweringRecipeArtifact
        signature: >-
          validateLoweringRecipeArtifact<TRecipe extends RecipeBase = RecipeBase>(
          artifact: unknown): asserts artifact is RecipeArtifactBase<TRecipe>
        throws: LoweringRecipeValidationError
      - name: loadProfile
        signature: >-
          loadProfile<TRecipe extends RecipeBase = RecipeBase>(profileArtifact: unknown,
          recipeArtifacts: readonly unknown[], resolve?: ResourceResolver,
          resolveTemplate?: ProfileTemplateResolver): ResolvedProfile<TRecipe>
        purpose: Validate and resolve a legacy Profile and its recipe artifacts.
      - name: applyProfileTemplate
        signature: >-
          applyProfileTemplate(artifact: ProfileArtifact,
          resolveTemplate?: ProfileTemplateResolver): ProfileArtifact
        purpose: Merge template default resources beneath Profile-owned resources.
      - name: resolveProfile
        signature: >-
          resolveProfile<TRecipe extends RecipeBase>(artifact: ProfileArtifact,
          recipeArtifacts: readonly RecipeArtifactBase<TRecipe>[],
          resolveResource?: ResourceResolver): ResolvedProfile<TRecipe>
        purpose: Resolve layers and recipes into one connected ordered execution chain.
      - name: resolveResources
        signature: >-
          resolveResources(artifact: ProfileArtifact,
          resolveResource?: ResourceResolver): Record<string, Json>
        purpose: Resolve inline and referenced Profile resources.
      - name: recipeForKinds
        signature: >-
          recipeForKinds<TRecipe extends RecipeBase>(profile: ResolvedProfile<TRecipe>,
          fromKind: string, toKind: string): TRecipe
        purpose: Return the recipe connecting two layer kinds or throw when absent.
      - name: lintProfileArtifacts
        signature: >-
          lintProfileArtifacts(artifact: ProfileArtifact,
          recipeArtifacts: readonly RecipeArtifactBase[]): RecipeLintWarning[]
        purpose: Report missing recipe artifacts and unknown layer references without throwing.

  - group: profile-execution
    category: legacy_transitional
    source: profile/src/profile-core.ts
    functions:
      - name: traceStages
        signature: >-
          traceStages<TRecipe extends RecipeBase>(profile: ResolvedProfile<TRecipe>,
          seed: unknown, context: LayerContext,
          executors: Record<string, StageExecutor<TRecipe>>): StageTrace[]
        purpose: Execute the resolved layer chain and retain every stage input and output.

  - group: profile-templates
    category: legacy_transitional
    source: profile/src/templates.ts
    functions:
      - "resolveProfileTemplate(id: string): ProfileTemplateArtifact"
      - "resolveProfileTemplateResource(ref: string, name: string): Json"
      - "profileTemplateResourceRef(templateId: string, file: string): string"
      - "requiredProfileTemplateFile(template: ProfileTemplateArtifact, name: string): string"
      - "resolveProfileTemplateFile(templateId: string, file: string): Json"
      - "resolveNamedProfileTemplateFile(template: ProfileTemplateArtifact, name: string): Json"

  - group: authoring-tools
    category: legacy_transitional
    source:
      - profile/src/authoring-runner.ts
      - profile/src/genui-authoring.ts
    functions:
      - name: bindAuthoringTools
        signature: >-
          bindAuthoringTools(profile: Profile,
          registry: AuthoringRegistry): AuthoringToolBinding[]
        purpose: Bind declarative Profile tool declarations to registry handlers.
      - name: createGenuiAuthoringRegistry
        signature: "createGenuiAuthoringRegistry(profile: Profile | ProfileArtifact): AuthoringRegistry"
        purpose: Create the current GenUI validator, describer, check, and projector registry.
      - name: structuralValidatorForLayer
        signature: >-
          structuralValidatorForLayer(layer: LayerDefinition | undefined,
          registry?: Pick<AuthoringRegistry, "validators">): StructuralValidator | undefined
        purpose: Resolve a layer's declared structural validator.

  - group: genui-execution
    category: legacy_transitional
    source: profile/src/genui-runtime.ts
    functions:
      - name: traceProfile
        signature: >-
          traceProfile(profile: ResolvedLayerProfile, seed: unknown,
          context: LayerContext,
          executors?: Record<string, StageExecutor<LayerRecipe>>): StageTrace[]
        purpose: Execute and trace a GenUI Profile through its selected executor IDs.
      - name: runProfile
        signature: >-
          runProfile(profile: ResolvedLayerProfile, seed: unknown,
          context: LayerContext,
          executors?: Record<string, StageExecutor<LayerRecipe>>): unknown
        purpose: Execute a GenUI Profile and return only its terminal output.
      - name: defaultStageExecutors
        signature: "defaultStageExecutors(): Record<string, StageExecutor<LayerRecipe>>"
        purpose: Return the built-in GenUI stage executor registry.
      - name: lowerWorkflow
        signature: >-
          lowerWorkflow(recipe: LayerRecipe,
          record?: GenuiEvidenceRecorder): (workflow: WorkflowSpec) => InteractionSpec
        purpose: Create a workflow-to-interaction lowering function.
      - name: lowerPresentation
        signature: >-
          lowerPresentation(recipe: LayerRecipe,
          record?: GenuiEvidenceRecorder): Lowering<PresentationSpec>
        purpose: Create the current presentation-to-kernel-document lowering function.

callable_extension_interfaces:
  - name: BlueprintReferenceResolver
    category: canonical
    signature: >-
      (ref: string, context: BlueprintReferenceContext) => BlueprintArtifact<TRecipe>
    purpose: Let a host locate a referenced child while package-owned assembly controls recursion.
  - name: ResourceResolver
    category: legacy_transitional
    signature: "(ref: string, name: string) => Json"
    purpose: Resolve one environment-specific Profile resource reference.
  - name: ProfileTemplateResolver
    category: legacy_transitional
    signature: "(id: string) => ProfileTemplateArtifact"
    purpose: Resolve one packaged or host-provided Profile template.
  - name: StageExecutor
    category: legacy_transitional
    signature: >-
      (recipe: TRecipe, input: unknown, context: LayerContext,
      profile: ResolvedProfile<TRecipe>) => unknown
    purpose: Execute one transition in a resolved Profile chain.
  - name: StructuralValidator
    category: legacy_transitional
    signature: "(args: Record<string, Json>) => AuthoringReport"
    purpose: Validate one authoring payload against a layer's structural contract.
  - name: RuntimeEmitter
    category: legacy_transitional
    methods:
      - "node(capability: string, id: string, options: TNodeOptions): TNode"
      - "output(root: TNode): TOutput"
    purpose: Adapt a lowering plan to a concrete runtime representation.

registry_interfaces:
  - name: AuthoringRegistry
    category: legacy_transitional
    callable_entries:
      - "validators?: Record<string, StructuralValidator>"
      - "describe?: Record<string, () => Json>"
      - "checks?: Record<string, (args) => Partial<AuthoringReport>>"
      - "projectors?: Record<string, (args) => Json>"

primary_data_contracts:
  canonical:
    - BlueprintArtifact
    - BlueprintProjections
    - BlueprintReferenceContext
    - CellDefinition
    - CellBlueprint
    - CellInput
    - CellOutput
    - CellSource
    - CellComputation
    - CellBehavior
    - CellView
    - CellComposition
    - ExecutableCellTopology
  legacy_transitional:
    - Profile
    - ProfileArtifact
    - ResolvedProfile
    - RecipeBase
    - LayerDefinition
    - WorkflowSpec
    - InteractionSpec
    - PresentationSpec
    - LayerRecipe

internal_candidate_exports:
  reason: >-
    The package currently exports many generic rule-selection and GenUI planning
    helpers. Their signatures should not become stable by accident.
  families:
    - template token and interpolation helpers
    - first-match and program-slot rule helpers
    - rank and cap helpers
    - GenUI recipe type guards and selectors
    - presentation planning and recipe lint internals

behavioral_guarantees:
  - Blueprint is the authored organism definition; no separate authored Organism exists.
  - Cells belong directly to a Blueprint and may omit presentation.
  - Child assembly is recursive, host-resolved, self-contained, and cycle-safe.
  - Topology and ProjectedProgramDefinition are projections over Cells, not intrinsic Blueprint structure.
  - New Blueprint APIs must not derive their public types from Profile.
  - Profile and GenUI functions remain transitional until Blueprint-native execution replaces them.

verification:
  commands:
    - npx vitest run --project profile
    - npm run test:samples
    - npm run build --workspace=@gik/profile

open_decisions:
  - Move canonical Blueprint and Cell APIs into a dedicated @gik/blueprint package?
  - Which legacy Profile and GenUI functions receive formal deprecation markers?
  - What Blueprint-native API replaces loadBlueprint and composeCellDocument bridges?
  - Which currently exported rule and planning helpers remain public for version 1?